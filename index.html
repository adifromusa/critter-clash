<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="dark">
<title>Critter Clash</title>
<meta name="description" content="A fast, original creature card duel against the computer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Critter Clash ─────────────────────────────────────────────
   A midnight card-table: ink ground, cream cards, gem accents.
   Palette tokens live here; every component reads from them.
   ────────────────────────────────────────────────────────────── */
:root {
  color-scheme: dark;
  --bg: #090b14;
  --bg-2: #10131f;
  --bg-3: #171b2c;
  --panel: rgba(255,255,255,.045);
  --panel-2: rgba(255,255,255,.075);
  --line: rgba(255,255,255,.10);
  --line-strong: rgba(255,255,255,.18);
  --ink: #f4efe4;
  --muted: #a3a3ba;
  --faint: #6f7088;
  --accent: #ff6a4d;
  --accent-2: #45e0c4;
  --gold: #ffc857;
  --good: #63e59b;
  --bad: #ff5d6e;
  --hp-good: #2fa96a;
  --card-face: #f6efdd;
  --card-ink: #241e33;
  --radius: 18px;
  --font-display: 'Bricolage Grotesque', 'Avenir Next', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --shadow: 0 18px 40px rgba(0,0,0,.5);
  --bench-w: clamp(62px, 8.5vw, 78px);
  --active-w: clamp(118px, 15.5vw, 146px);
  --hand-w: clamp(104px, 11.5vw, 126px);
}
* { box-sizing: border-box; }
html { height: 100%; background: var(--bg); }
body {
  margin: 0;
  min-height: 100%;
  background:
    radial-gradient(1100px 620px at 10% -12%, rgba(69,224,196,.15), transparent 60%),
    radial-gradient(900px 540px at 102% -6%, rgba(255,106,77,.14), transparent 58%),
    radial-gradient(900px 700px at 50% 118%, rgba(124,93,255,.14), transparent 62%),
    var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image: radial-gradient(rgba(255,255,255,.055) 1px, transparent 1px);
  background-size: 26px 26px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 15%, transparent 78%);
  mask-image: radial-gradient(ellipse at 50% 30%, #000 15%, transparent 78%);
}
::selection { background: rgba(69,224,196,.32); }
button { font: inherit; }
button, [role="button"] { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.card, .btn, .mode-chip, .deck-tab, .match-option, .difficulty-option { -webkit-user-select: none; user-select: none; }
h1, h2, h3, p { margin: 0; }
:where(button, [tabindex]):focus-visible {
  outline: 2px solid var(--accent-2);
  outline-offset: 3px;
}

.app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 6px;
  padding-bottom: max(22px, env(safe-area-inset-bottom, 0px));
}

/* ── Top bar ─────────────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  padding-block: 16px 12px;
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand-mark {
  width: 40px; height: 40px; flex: none;
  display: grid; place-items: center;
  filter: drop-shadow(0 6px 16px rgba(69,224,196,.28));
}
.brand-mark svg { width: 40px; height: 40px; display: block; }
.brand h1 {
  font-family: var(--font-display);
  font-size: clamp(20px, 2.6vw, 26px);
  font-weight: 800;
  letter-spacing: -.02em;
  line-height: 1;
  white-space: nowrap;
}
.brand-sub {
  margin-top: 4px;
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
.topbar-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.record {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .04em;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: rgba(255,255,255,.025);
  white-space: nowrap;
}
.record b { color: var(--ink); font-weight: 500; }

/* ── Buttons ─────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 9px 14px;
  border-radius: 11px;
  border: 1px solid var(--line-strong);
  background: rgba(255,255,255,.055);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.1;
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease, transform .12s ease, opacity .15s ease;
  white-space: nowrap;
}
.btn:hover:not(:disabled) { background: rgba(255,255,255,.11); border-color: rgba(255,255,255,.28); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn--primary {
  background: linear-gradient(160deg, #ff8a6d, var(--accent));
  border-color: rgba(255,255,255,.32);
  color: #2c0d05;
  box-shadow: 0 8px 22px rgba(255,106,77,.26);
}
.btn--primary:hover:not(:disabled) { background: linear-gradient(160deg, #ff9b82, #ff7458); }
.btn--teal {
  background: linear-gradient(160deg, #76f2da, var(--accent-2));
  border-color: rgba(255,255,255,.32);
  color: #042a24;
  box-shadow: 0 8px 22px rgba(69,224,196,.2);
}
.btn--teal:hover:not(:disabled) { background: linear-gradient(160deg, #8bf7e2, #58e9cd); }
.btn--ghost { background: transparent; }
.btn--sm { padding: 6px 10px; font-size: 12px; border-radius: 9px; }
.icon-btn { width: 36px; height: 36px; padding: 0; flex: none; }
.icon-btn svg { width: 16px; height: 16px; }

/* ── The table ───────────────────────────────────────────── */
.table {
  position: relative;
  border-radius: 26px;
  border: 1px solid var(--line);
  background:
    radial-gradient(110% 90% at 50% 0%, rgba(255,255,255,.055), transparent 55%),
    linear-gradient(180deg, rgba(22,26,43,.94), rgba(11,13,22,.97));
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.07);
  padding: clamp(12px, 2vw, 20px);
  overflow: hidden;
}
.table::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 46px 46px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 25%, transparent 82%);
  mask-image: radial-gradient(ellipse at 50% 50%, #000 25%, transparent 82%);
  opacity: .8;
}
.table.shake { animation: shake .42s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake {
  10%, 90% { transform: translate(-1px, 1px); }
  20%, 80% { transform: translate(3px, -2px); }
  30%, 50%, 70% { transform: translate(-5px, 1px); }
  40%, 60% { transform: translate(5px, -1px); }
}
.side { position: relative; z-index: 1; display: flex; flex-direction: column; }
.side--opp { gap: 8px; }
.side--mine { gap: 8px; }
.side-head {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
  min-height: 22px;
  font-size: 10.5px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted);
}
.side--opp .side-head { justify-content: flex-start; }
.side--mine .side-head { justify-content: flex-start; padding-top: 2px; }
.side-name {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 12px;
  letter-spacing: .12em;
  color: var(--ink);
}
.prizes { display: inline-flex; gap: 4px; align-items: center; }
.prize {
  width: 8px; height: 8px; border-radius: 50%;
  border: 1px solid var(--line-strong);
  background: transparent;
  transition: background .25s, box-shadow .25s, border-color .25s;
}
.prize.won {
  background: var(--gold);
  border-color: var(--gold);
  box-shadow: 0 0 9px rgba(255,200,87,.55);
}
.side-sep { width: 1px; height: 10px; background: var(--line-strong); }
.deck-count, .hand-count { font-family: var(--font-mono); letter-spacing: .02em; text-transform: none; font-size: 10.5px; }
.hand-stack { display: inline-flex; align-items: center; }
.hand-stack .card-back {
  position: relative;
  width: 12px; height: 17px;
  border-radius: 3px;
  border: 1px solid rgba(255,255,255,.3);
  background:
    linear-gradient(135deg, rgba(255,255,255,.18), transparent 45%),
    linear-gradient(160deg, #323765, #171a2f);
  box-shadow: 0 1px 3px rgba(0,0,0,.45);
}
.hand-stack .card-back::after {
  content: "";
  position: absolute;
  left: 50%; top: 50%;
  width: 5px; height: 5px;
  margin: -2.5px 0 0 -2.5px;
  transform: rotate(45deg);
  border-radius: 1px;
  background: var(--accent-2);
  opacity: .85;
}

.side-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(10px, 2.2vw, 28px);
}
.bench-row {
  display: flex;
  align-items: center;
  gap: clamp(6px, 1.1vw, 12px);
}
.active-row { display: flex; justify-content: center; }
.midline {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-block: clamp(7px, 1.2vw, 12px);
  position: relative;
  z-index: 2;
}
.midline .line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--line-strong)); }
.midline .line:last-child { background: linear-gradient(90deg, var(--line-strong), transparent); }
.turn-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: rgba(255,255,255,.05);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--muted);
}
.turn-pill .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent-2);
  box-shadow: 0 0 10px var(--accent-2);
  animation: pulse 2.2s ease-in-out infinite;
}
.turn-pill.ai .dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.turn-pill.mine { color: var(--ink); border-color: rgba(69,224,196,.35); }
.turn-pill.setup .dot, .turn-pill.over .dot { background: var(--gold); box-shadow: 0 0 10px var(--gold); animation: none; }
.turn-no { font-family: var(--font-mono); font-weight: 400; color: var(--faint); letter-spacing: 0; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* ── Slots & cards ───────────────────────────────────────── */
.slot, .hand-item { container-type: inline-size; }
.slot { position: relative; flex: none; }
.slot--active { width: var(--active-w); aspect-ratio: 5 / 7; }
.slot--bench { width: var(--bench-w); aspect-ratio: 5 / 7; }
.hand-item { width: var(--hand-w); flex: 0 0 auto; scroll-snap-align: center; }

.card {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 1.5cqw;
  padding: 3.2cqw;
  border: 3px solid transparent;
  border-radius: 10px;
  background:
    linear-gradient(160deg, #fdf9ee, #efe4cd) padding-box,
    linear-gradient(155deg, var(--tl, #bbb), var(--tc, #888) 55%, var(--td, #555)) border-box;
  box-shadow: 0 9px 20px rgba(0,0,0,.42), 0 0 16px rgba(255,255,255,.06), inset 0 0 0 1px rgba(255,255,255,.45);
  box-shadow: 0 9px 20px rgba(0,0,0,.42), 0 0 18px color-mix(in srgb, var(--tc, #ffffff) 20%, transparent), inset 0 0 0 1px rgba(255,255,255,.45);
  color: var(--card-ink);
  overflow: hidden;
  transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
}
.card::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  border-radius: 7px;
  background: linear-gradient(112deg, transparent 34%, rgba(255,255,255,.5) 47%, rgba(255,255,255,.08) 56%, transparent 66%);
  opacity: 0;
  transition: opacity .25s ease;
  mix-blend-mode: overlay;
}
.slot--active .card::after { opacity: .5; }
.hand-item:hover .card::after { opacity: .65; }
.card--active { cursor: default; }
.card--hand { cursor: pointer; }
.hand-item:hover .card {
  transform: translateY(-6px);
  filter: brightness(1.03);
  box-shadow: 0 16px 28px rgba(0,0,0,.5), 0 0 24px rgba(255,255,255,.1), inset 0 0 0 1px rgba(255,255,255,.5);
  box-shadow: 0 16px 28px rgba(0,0,0,.5), 0 0 26px color-mix(in srgb, var(--tc, #ffffff) 32%, transparent), inset 0 0 0 1px rgba(255,255,255,.5);
}
.hand-item:active .card { transform: translateY(-2px); }
.card--bench { cursor: pointer; padding: 2.2cqw; gap: 0; }
.card--bench:hover { transform: translateY(-3px); }
.card--bench.no-click { cursor: default; }
.card--bench.no-click:hover { transform: none; }

.card-head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 1.6cqw;
  flex: none;
}
.card-name {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: max(7.2cqw, 9.5px);
  line-height: 1;
  letter-spacing: -.015em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-hp {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: max(8.2cqw, 11px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.card-hp small { font-size: .5em; opacity: .5; font-weight: 400; }
.type-pip {
  width: max(4.6cqw, 7px);
  height: max(4.6cqw, 7px);
  border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, #fff8, transparent 46%), var(--tc, #999);
  border: 1px solid rgba(0,0,0,.22);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55);
  flex: none;
}
.hp-track {
  flex: none;
  height: max(1.5cqw, 3px);
  border-radius: 99px;
  background: rgba(36,30,51,.14);
  overflow: hidden;
}
.hp-track > span {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: var(--hp-good);
  transition: width .45s cubic-bezier(.2,.7,.2,1), background .3s;
}
.hp-track.warn > span { background: #c99310; }
.hp-track.crit > span { background: #d4432c; }
.art-frame {
  position: relative;
  flex: 1;
  min-height: 0;
  border-radius: 5px;
  overflow: hidden;
  border: 1px solid rgba(36,30,51,.16);
  background:
    radial-gradient(90% 70% at 50% 20%, rgba(255,255,255,.85), transparent 62%),
    linear-gradient(180deg, var(--tl, #eee), #fff9ee 90%);
}
.art-frame svg { display: block; width: 100%; height: 100%; }
.energy-strip {
  position: absolute;
  left: 2cqw;
  bottom: 2cqw;
  display: flex;
  align-items: center;
  gap: 1.4cqw;
  padding: 1.2cqw 2cqw;
  border-radius: 99px;
  background: rgba(14,12,22,.76);
  border: 1px solid rgba(255,255,255,.16);
  box-shadow: 0 2px 6px rgba(0,0,0,.3);
  max-width: calc(100% - 4cqw);
}
.energy-strip .pip { width: max(2.6cqw, 4px); height: max(2.6cqw, 4px); }
.energy-strip .empty-energy {
  font-size: max(3.6cqw, 5px);
  color: rgba(255,255,255,.55);
  letter-spacing: .06em;
  text-transform: uppercase;
  white-space: nowrap;
}
.sync-chip {
  font-size: max(3.8cqw, 5.5px);
  font-weight: 700;
  letter-spacing: .06em;
  color: #052a23;
  background: var(--accent-2);
  border-radius: 99px;
  padding: .8cqw 1.8cqw;
  line-height: 1;
  white-space: nowrap;
}
.pip {
  display: inline-block;
  width: max(2.6cqw, 5px);
  height: max(2.6cqw, 5px);
  flex: none;
  transform: rotate(45deg);
  border-radius: 1px;
  background: linear-gradient(135deg, var(--pc, #999), var(--pd, #555));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
}
.pip--cost { background: linear-gradient(135deg, #a09aaf, #57506c); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
.atk-list { display: flex; flex-direction: column; gap: 1.3cqw; flex: none; }
.atk {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 1.7cqw;
  min-height: max(8cqw, 15px);
  padding: 1.3cqw 2cqw;
  border-radius: 4px;
  border: 1px solid rgba(36,30,51,.14);
  background: rgba(36,30,51,.055);
  color: var(--card-ink);
  font-family: var(--font-body);
  text-align: left;
  cursor: pointer;
  transition: background .12s ease;
}
.atk:disabled { opacity: .48; cursor: not-allowed; }
.atk:not(:disabled):hover { background: rgba(36,30,51,.11); }
.atk--static { cursor: default; }
.atk .cost { display: flex; gap: 1cqw; align-items: center; }
.atk .cost .pip { width: max(2.5cqw, 4px); height: max(2.5cqw, 4px); }
.atk-name {
  font-size: max(6.1cqw, 7.5px);
  font-weight: 600;
  line-height: 1.15;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.atk-dmg {
  font-family: var(--font-mono);
  font-size: max(7.4cqw, 9px);
  font-weight: 500;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.atk.is-boosted .atk-dmg { color: #a03712; }
.atk-used { background: rgba(69,224,196,.2) !important; border-color: rgba(29,128,111,.5) !important; }
.card-foot {
  display: flex;
  justify-content: space-between;
  gap: 1cqw;
  flex: none;
  font-size: max(4.9cqw, 6px);
  letter-spacing: .055em;
  text-transform: uppercase;
  color: rgba(36,30,51,.58);
  line-height: 1.2;
}
.card-foot b { color: var(--card-ink); font-weight: 700; }
.card-foot .hot { color: #a5311a; }
.card-foot .hot b { color: #a5311a; }

/* Bench card */
.bench-art {
  position: relative;
  flex: 1;
  min-height: 0;
  border-radius: 4px;
  overflow: hidden;
  background:
    radial-gradient(90% 70% at 50% 20%, rgba(255,255,255,.85), transparent 62%),
    linear-gradient(180deg, var(--tl, #eee), #fff9ee 90%);
}
.bench-art svg { display: block; width: 100%; height: 100%; }
.bench-bar {
  display: flex;
  align-items: baseline;
  padding-top: 1.4cqw;
  flex: none;
  min-width: 0;
}
.bench-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: max(10.5cqw, 8px);
  line-height: 1;
  letter-spacing: -.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.bench-hp {
  position: absolute;
  top: 3cqw;
  right: 3cqw;
  z-index: 2;
  font-family: var(--font-mono);
  font-size: max(9cqw, 7px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: #fff;
  padding: .9cqw 1.6cqw;
  border-radius: 99px;
  background: rgba(14,12,22,.78);
  border: 1px solid rgba(255,255,255,.18);
  box-shadow: 0 1px 4px rgba(0,0,0,.3);
}
.bench-energy {
  position: absolute;
  left: 1.6cqw;
  bottom: 1.6cqw;
  display: flex;
  align-items: center;
  gap: 1cqw;
  padding: .8cqw 1.4cqw;
  border-radius: 99px;
  background: rgba(14,12,22,.72);
}
.bench-energy .pip { width: max(2.4cqw, 3px); height: max(2.4cqw, 3px); }
.bench-empty .bench-bar { opacity: .5; }
.slot-empty {
  width: 100%;
  height: 100%;
  border: 1px dashed rgba(255,255,255,.14);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: rgba(255,255,255,.014);
  color: var(--faint);
  font-size: 9px;
  letter-spacing: .12em;
  text-transform: uppercase;
  text-align: center;
  padding: 6px;
}
.slot-empty--active { aspect-ratio: 5 / 7; width: var(--active-w); }
.slot-empty--bench { aspect-ratio: 5 / 7; width: var(--bench-w); }
.slot-empty .empty-plus { font-size: 20px; line-height: 1; color: rgba(255,255,255,.25); }
.slot-empty--bench .empty-plus { font-size: 13px; }

/* Attach + promote affordances */
.attachable .card { outline: 2px solid var(--accent-2); outline-offset: 3px; animation: attachGlow 1.5s ease-in-out infinite; }
@keyframes attachGlow {
  0%,100% { box-shadow: 0 0 0 2px rgba(69,224,196,.18), 0 9px 20px rgba(0,0,0,.42); }
  50% { box-shadow: 0 0 0 6px rgba(69,224,196,.16), 0 9px 24px rgba(69,224,196,.2); }
}
.promotable .card { outline: 2px solid var(--gold); outline-offset: 3px; animation: promoteGlow 1.4s ease-in-out infinite; cursor: pointer; }
@keyframes promoteGlow {
  0%,100% { box-shadow: 0 0 0 2px rgba(255,200,87,.2), 0 9px 20px rgba(0,0,0,.42); }
  50% { box-shadow: 0 0 0 7px rgba(255,200,87,.18), 0 9px 24px rgba(255,200,87,.22); }
}
.promote-tag {
  position: absolute;
  left: 50%;
  bottom: -9px;
  transform: translateX(-50%);
  z-index: 4;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--gold);
  color: #2a1c00;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  white-space: nowrap;
  box-shadow: 0 3px 8px rgba(0,0,0,.4);
}
.evo-line {
  flex: none;
  text-align: center;
  font-size: max(4.7cqw, 5.5px);
  line-height: 1.2;
  letter-spacing: .01em;
  color: rgba(36,30,51,.58);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.evo-chip {
  position: absolute;
  top: 2cqw;
  right: 2cqw;
  z-index: 2;
  padding: .9cqw 1.8cqw;
  border-radius: 99px;
  background: linear-gradient(140deg, #f7d488, #dc9b3d);
  color: #3b2600;
  font-size: max(3.7cqw, 5px);
  font-weight: 800;
  letter-spacing: .1em;
  line-height: 1;
  text-transform: uppercase;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}
.evolvable .card {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
  animation: evolveGlow 1.5s ease-in-out infinite;
  cursor: pointer;
}
@keyframes evolveGlow {
  0%, 100% { box-shadow: 0 0 0 2px rgba(255,200,87,.18), 0 9px 20px rgba(0,0,0,.42); }
  50% { box-shadow: 0 0 0 6px rgba(255,200,87,.15), 0 9px 24px rgba(255,200,87,.22); }
}
.evolve-tag {
  position: absolute;
  left: 50%;
  bottom: -9px;
  transform: translateX(-50%);
  z-index: 4;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--gold);
  color: #2a1c00;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  white-space: nowrap;
  box-shadow: 0 3px 8px rgba(0,0,0,.4);
}
.slot.is-evolving .card { animation: evolveFlash .8s ease; }
@keyframes evolveFlash {
  0% { filter: brightness(1); }
  30% { filter: brightness(1.7) saturate(1.25); box-shadow: 0 0 34px rgba(255,215,120,.85); }
  100% { filter: brightness(1); }
}
.pack-evo {
  display: block;
  margin-top: 2px;
  font-size: 8px;
  line-height: 1.25;
  color: rgba(36,30,51,.55);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Damage float + impact */
.float-dmg {
  position: absolute;
  left: 50%;
  top: 34%;
  z-index: 6;
  transform: translate(-50%, 0);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(20px, 3vw, 30px);
  color: #ffd9cc;
  text-shadow: 0 2px 0 #7a220e, 0 0 18px rgba(255,95,60,.9);
  pointer-events: none;
  animation: floatUp .95s cubic-bezier(.2,.7,.2,1) forwards;
}
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, 8px) scale(.7); }
  18% { opacity: 1; transform: translate(-50%, -4px) scale(1.1); }
  70% { opacity: 1; transform: translate(-50%, -30px) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -48px) scale(.95); }
}
.slot.is-ko .card { animation: koSink .6s ease forwards; }
@keyframes koSink {
  0% { transform: translateY(0) rotate(0); opacity: 1; filter: grayscale(0); }
  100% { transform: translateY(34px) rotate(-8deg); opacity: 0; filter: grayscale(1) brightness(.6); }
}

/* ── Status + hand ───────────────────────────────────────── */
.statusbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 12px;
  padding: 9px 12px 9px 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
  min-height: 50px;
}
.status-text {
  font-size: 13px;
  color: var(--muted);
  min-width: 0;
  flex: 1 1 220px;
}
.status-text.flash { color: var(--ink); }
.status-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.attach-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--accent-2);
  padding: 5px 9px;
  border-radius: 99px;
  border: 1px solid rgba(69,224,196,.24);
  background: rgba(69,224,196,.07);
  white-space: nowrap;
}
.attach-chip.used { color: var(--faint); border-color: var(--line); background: transparent; }

.hand-wrap {
  margin-top: 12px;
  padding: 11px 12px 12px;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
}
.hand-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding: 0 4px 9px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
}
.hand-hint { letter-spacing: .06em; text-transform: none; color: var(--faint); font-weight: 400; }
.hand-rail {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 8px 4px 6px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.18) transparent;
  scroll-snap-type: x proximity;
}
.hand-rail::-webkit-scrollbar { height: 6px; }
.hand-rail::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 99px; }
.hand-empty { color: var(--faint); font-size: 13px; padding: 24px 6px; }
.hand-item.is-selected .card { outline: 2px solid var(--accent-2); outline-offset: 3px; transform: translateY(-6px); }
.hand-item.is-selected .card::after { opacity: .8; }

/* Hand card details */
.card--hand { padding: 3.4cqw; gap: 1.6cqw; }
.mini-atks { display: flex; flex-direction: column; gap: 1.2cqw; flex: none; }
.mini-atk {
  display: flex;
  align-items: center;
  gap: 1.5cqw;
  padding: 1.1cqw 1.8cqw;
  border-radius: 3px;
  border: 1px solid rgba(36,30,51,.12);
  background: rgba(36,30,51,.05);
  font-size: max(5.5cqw, 7px);
}
.mini-atk .cost { display: flex; gap: .8cqw; flex: none; }
.mini-atk .cost .pip { width: max(2.2cqw, 3.5px); height: max(2.2cqw, 3.5px); }
.mini-atk .mname {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: rgba(36,30,51,.68);
  font-size: max(4.9cqw, 6.5px);
}
.mini-atk .dmg { font-family: var(--font-mono); font-weight: 500; font-size: max(6.2cqw, 8px); flex: none; }
.card--hand .card-foot { font-size: max(4.6cqw, 5.5px); }

/* Energy card */
.energy-card .energy-inner {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2.4cqw;
  text-align: center;
}
.energy-kicker {
  font-size: max(4.4cqw, 6px);
  letter-spacing: .18em;
  text-transform: uppercase;
  color: rgba(36,30,51,.48);
}
.energy-gem svg { width: 46cqw; height: auto; display: block; filter: drop-shadow(0 5px 8px rgba(0,0,0,.18)); }
.energy-name {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: max(7.4cqw, 9px);
  line-height: 1;
  letter-spacing: -.01em;
}
.energy-type {
  font-size: max(5cqw, 6.5px);
  letter-spacing: .1em;
  text-transform: uppercase;
  color: rgba(36,30,51,.6);
}
.energy-zap {
  margin-top: .6cqw;
  font-size: max(4.3cqw, 5.5px);
  letter-spacing: .04em;
  color: rgba(36,30,51,.42);
  line-height: 1.3;
}

/* ── Overlays ────────────────────────────────────────────── */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  padding:
    max(16px, env(safe-area-inset-top, 0px))
    max(16px, env(safe-area-inset-right, 0px))
    max(16px, env(safe-area-inset-bottom, 0px))
    max(16px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
  animation: fadeIn .18s ease;
}
.overlay-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(5,6,12,.74);
  -webkit-backdrop-filter: blur(7px);
  backdrop-filter: blur(7px);
}
.overlay-backdrop.quiet { background: rgba(5,6,12,.62); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  position: relative;
  z-index: 1;
  width: min(580px, 100%);
  max-height: calc(100dvh - 40px);
  overflow-y: auto;
  padding: clamp(22px, 4vw, 34px);
  border-radius: 22px;
  border: 1px solid var(--line-strong);
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(69,224,196,.07), transparent 55%),
    linear-gradient(180deg, #171b2c, #0f121e);
  box-shadow: 0 34px 90px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.08);
  animation: modalIn .24s cubic-bezier(.2,.8,.2,1);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
.modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 32px;
  height: 32px;
  padding: 0;
  font-size: 18px;
  line-height: 1;
}
.eyebrow {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--accent-2);
  margin-bottom: 8px;
}
.modal h2 {
  font-family: var(--font-display);
  font-size: clamp(24px, 4vw, 32px);
  font-weight: 800;
  letter-spacing: -.03em;
  line-height: 1.05;
  color: var(--ink);
  text-wrap: balance;
  padding-right: 28px;
}
.modal-sub {
  margin-top: 10px;
  color: var(--muted);
  font-size: 13.5px;
  max-width: 46ch;
}
.modal-actions {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 22px;
}
.modal-actions .btn { flex: 0 0 auto; }
.rule-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px 22px;
  margin-top: 22px;
}
.rule-grid section { min-width: 0; }
.rule-wide { grid-column: 1 / -1; }
.rule-grid h3 {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .02em;
  color: var(--ink);
  margin-bottom: 6px;
}
.rule-grid p, .rule-grid li { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.rule-grid ol, .rule-grid ul { margin: 0; padding-left: 17px; display: flex; flex-direction: column; gap: 3px; }
.rule-grid b { color: var(--ink); font-weight: 600; }
.weak-list { list-style: none; padding-left: 0 !important; margin-top: 6px !important; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
.weak-list li { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }
.weak-list .pip { width: 7px; height: 7px; }
.log-list { list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-direction: column; gap: 0; max-height: 46vh; overflow-y: auto; border-top: 1px solid var(--line); }
.log-item {
  padding: 9px 2px;
  border-bottom: 1px solid rgba(255,255,255,.055);
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.log-item.log-turn { color: var(--accent-2); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; padding-top: 13px; }
.log-item .log-num { font-family: var(--font-mono); font-size: 10px; color: var(--faint); margin-right: 8px; }
.final-score {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin: 22px 0 4px;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.035);
  font-family: var(--font-mono);
  font-size: 15px;
  font-variant-numeric: tabular-nums;
}
.final-score b { font-family: var(--font-display); font-size: 24px; font-weight: 800; color: var(--ink); }
.final-score .score-mid { color: var(--faint); font-size: 11px; letter-spacing: .16em; }
.record-line { margin-top: 14px; font-size: 11.5px; color: var(--faint); font-family: var(--font-mono); }
.trophy {
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  margin-bottom: 16px;
  background: linear-gradient(155deg, rgba(255,200,87,.2), rgba(255,106,77,.08));
  border: 1px solid rgba(255,200,87,.3);
  color: var(--gold);
}
.trophy svg { width: 26px; height: 26px; }
.promote-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
  margin-top: 20px;
}
.promote-card {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 10px;
  border-radius: 14px;
  border: 1px solid var(--line-strong);
  background: rgba(255,255,255,.045);
  color: var(--ink);
  cursor: pointer;
  text-align: left;
  transition: background .15s ease, border-color .15s ease, transform .15s ease;
}
.promote-card:hover { background: rgba(255,255,255,.09); border-color: rgba(255,200,87,.5); transform: translateY(-2px); }
.promote-art {
  display: block;
  aspect-ratio: 5 / 3;
  border-radius: 8px;
  overflow: hidden;
  background: linear-gradient(180deg, var(--tl), #fff9ee);
  border: 1px solid rgba(0,0,0,.15);
}
.promote-art svg { width: 100%; height: 100%; display: block; }
.promote-name { font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 1; }
.promote-stats { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.confirm-box { margin-top: 18px; padding: 13px 15px; border-radius: 12px; border: 1px solid rgba(255,93,110,.3); background: rgba(255,93,110,.07); color: var(--muted); font-size: 12.5px; }

/* ── FX layer ────────────────────────────────────────────── */
.fx-layer { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; }
/* ── Type-specific attacks ───────────────────────────────── */
.fx-shot {
  position: absolute;
  z-index: 60;
  height: 10px;
  margin-top: -5px;
  transform-origin: 0 50%;
  pointer-events: none;
}
.fx-shot .core {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 99px;
  transform-origin: left center;
  animation: fxShot .5s cubic-bezier(.2,.72,.2,1) forwards;
}
@keyframes fxShot {
  0% { transform: scaleX(0); opacity: 0; }
  18% { opacity: 1; }
  65% { opacity: 1; }
  100% { transform: scaleX(1); opacity: 0; }
}
.fx-shot.fx-fire { height: 20px; margin-top: -10px; }
.fx-shot.fx-fire .core {
  background: linear-gradient(90deg, rgba(255,90,30,0), #ff5a1f 18%, #ffb347 62%, #fff2bf 90%, rgba(255,255,255,0));
  filter: drop-shadow(0 0 12px #ff6a2a) blur(.4px);
}
.fx-shot.fx-fire .flame {
  position: absolute;
  width: 26px;
  height: 22px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 70%, #fff3c4 0%, #ffb347 38%, #ff5a1f 62%, transparent 75%);
  filter: blur(1px);
  opacity: 0;
  animation: fxFlameTrail .55s ease-out forwards;
}
.fx-shot.fx-fire .f1 { left: 52%; top: -10px; }
.fx-shot.fx-fire .f2 { left: 76%; top: 8px; transform: scale(.75); animation-delay: .06s; }
@keyframes fxFlameTrail {
  0% { opacity: 0; transform: scale(.4); }
  30% { opacity: 1; }
  100% { opacity: 0; transform: scale(1.35); }
}
.fx-shot.fx-water { height: 9px; margin-top: -4.5px; }
.fx-shot.fx-water .core {
  background: linear-gradient(90deg, transparent, #2f9dff 25%, #b9f4ff 68%, #fff 92%, transparent);
  filter: drop-shadow(0 0 10px #4ab7ff);
}
.fx-shot.fx-water .shot-drop {
  position: absolute;
  width: 6px;
  height: 9px;
  border-radius: 50% 50% 50% 0;
  background: #c8f4ff;
  box-shadow: 0 0 6px #68d4ff;
  opacity: 0;
  animation: fxShotDrop .55s ease-out forwards;
}
.fx-shot.fx-water .sd1 { left: 32%; top: -8px; animation-delay: .03s; }
.fx-shot.fx-water .sd2 { left: 58%; top: 8px; animation-delay: .09s; }
.fx-shot.fx-water .sd3 { left: 78%; top: -6px; animation-delay: .14s; }
@keyframes fxShotDrop {
  0% { opacity: 0; transform: translateY(0) rotate(45deg) scale(.6); }
  35% { opacity: 1; }
  100% { opacity: 0; transform: translateY(14px) rotate(45deg) scale(1); }
}
.fx-shot.fx-grass .core {
  height: 8px;
  margin-top: 1px;
  background: linear-gradient(90deg, transparent, #2f9d4a, #c9ffb0 70%, transparent);
  filter: drop-shadow(0 0 9px #4fc46a);
}
.fx-shot.fx-rock { height: 16px; margin-top: -8px; }
.fx-shot.fx-rock .core {
  border-radius: 40% 20% 35% 15%;
  background: linear-gradient(90deg, transparent, #6b4e2e, #d8b98c 60%, #5a4226 92%, transparent);
  filter: drop-shadow(0 0 8px #8a6a3f);
}
.fx-shot.fx-rock .rock-bit {
  position: absolute;
  width: 11px;
  height: 8px;
  background: #a98a62;
  clip-path: polygon(50% 0, 100% 60%, 70% 100%, 20% 85%, 0 45%);
  animation: fxRockBit .6s ease-out forwards;
}
.fx-shot.fx-rock .rb1 { left: 45%; top: -9px; }
.fx-shot.fx-rock .rb2 { left: 68%; top: 9px; }
@keyframes fxRockBit {
  0% { opacity: 0; transform: scale(.4) rotate(0); }
  25% { opacity: 1; }
  100% { opacity: 0; transform: scale(1.1) rotate(90deg); }
}
.fx-shot.fx-ice { height: 8px; margin-top: -4px; }
.fx-shot.fx-ice .core {
  background: linear-gradient(90deg, transparent, #6fe5ff 30%, #fff 75%, transparent);
  filter: drop-shadow(0 0 12px #9bf3ff);
}
.fx-impact { position: absolute; width: 0; height: 0; z-index: 60; pointer-events: none; }
.fx-impact .burst {
  position: absolute;
  left: -20px;
  top: -20px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, var(--fx-light) 22%, var(--fx) 45%, transparent 72%);
  filter: drop-shadow(0 0 18px var(--fx));
  animation: fxBurst .6s ease-out forwards;
}
@keyframes fxBurst {
  0% { opacity: 1; transform: scale(.3); }
  100% { opacity: 0; transform: scale(3.3); }
}
.fx-impact .ring {
  position: absolute;
  left: -26px;
  top: -26px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 2px solid var(--fx-light);
  box-shadow: 0 0 14px var(--fx);
  animation: fxRing .55s ease-out forwards;
}
@keyframes fxRing {
  0% { opacity: .9; transform: scale(.3); }
  100% { opacity: 0; transform: scale(2.6); }
}
.fx-impact .p {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--sz, 6px);
  height: var(--sz, 6px);
  transform: translate(-50%, -50%);
  opacity: 0;
  pointer-events: none;
  animation: fxParticle .78s cubic-bezier(.15,.7,.3,1) forwards;
  animation-delay: var(--d, 0ms);
}
@keyframes fxParticle {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(.4) rotate(0deg); }
  15% { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px))) scale(.75) rotate(var(--rot, 0deg)); }
}
.fx-impact.fx-fire .p { background: radial-gradient(circle, #fff3c4, #ff9a3c 60%, #ff5a1f); border-radius: 50%; box-shadow: 0 0 9px #ff6a2a; }
.fx-impact.fx-water .p { background: #9fe6ff; border-radius: 50% 50% 50% 0; box-shadow: 0 0 7px #55c8ff; }
.fx-impact.fx-grass .p { background: #a8e063; border-radius: 70% 10% 70% 10%; box-shadow: 0 0 6px #63c46a; }
.fx-impact.fx-electric .p { width: calc(var(--sz, 6px) * .55); background: #ffe066; border-radius: 2px; box-shadow: 0 0 8px #ffd23f; }
.fx-impact.fx-rock .p { background: #b08a5c; clip-path: polygon(50% 0, 100% 60%, 70% 100%, 20% 85%, 0 45%); }
.fx-impact.fx-ice .p { background: #d9fbff; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); box-shadow: 0 0 7px #7fe6ff; }
.fx-slash {
  position: absolute;
  width: 190px;
  height: 8px;
  margin: -4px 0 0 -95px;
  z-index: 62;
  border-radius: 99px;
  background: linear-gradient(90deg, transparent, var(--fx-light), #fff, var(--fx), transparent);
  filter: drop-shadow(0 0 12px var(--fx));
  transform-origin: center;
  animation: fxSlash .68s ease-out forwards;
}
@keyframes fxSlash {
  0% { opacity: 0; transform: rotate(var(--rot)) scaleX(.2); }
  25% { opacity: 1; }
  100% { opacity: 0; transform: rotate(var(--rot)) scaleX(1.45); }
}
.slot.fx-burning .card { animation: fxBurnCard 1.05s ease-out; }
@keyframes fxBurnCard {
  0% { filter: none; }
  16% { filter: drop-shadow(0 0 22px rgba(255,110,40,.85)) saturate(1.12); }
  60% { filter: drop-shadow(0 0 14px rgba(255,90,30,.55)); }
  100% { filter: none; }
}
.slot.fx-wet .card { animation: fxWetCard .85s ease-out; }
@keyframes fxWetCard {
  0% { filter: none; }
  16% { filter: drop-shadow(0 0 20px rgba(80,190,255,.8)) saturate(1.08); }
  100% { filter: none; }
}
.fx-bolt {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
  z-index: 61;
  animation: fxBoltFlash .6s ease-out forwards;
}
@keyframes fxBoltFlash {
  0% { opacity: 0; }
  8% { opacity: 1; }
  30% { opacity: .35; }
  42% { opacity: 1; }
  65% { opacity: .55; }
  100% { opacity: 0; }
}
.fx-burn {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
  border-radius: 10px;
  overflow: hidden;
  background: radial-gradient(70% 60% at 50% 100%, rgba(255,110,30,.5), transparent 72%);
  mix-blend-mode: screen;
  animation: fxBurnFade 1.1s ease-out forwards;
}
.fx-burn i {
  position: absolute;
  bottom: -8%;
  width: 40%;
  height: 62%;
  border-radius: 50% 50% 42% 42%;
  background: radial-gradient(ellipse at 50% 100%, #fff2bf 0%, #ffb347 32%, #ff5a1f 58%, rgba(255,80,20,0) 78%);
  filter: blur(1.6px);
  animation: fxBurnFlame .55s ease-in-out infinite alternate;
  animation-delay: var(--fd, 0s);
}
.fx-burn i:nth-child(1) { left: 2%; --fd: 0s; }
.fx-burn i:nth-child(2) { left: 26%; --fd: .12s; height: 54%; }
.fx-burn i:nth-child(3) { left: 52%; --fd: .05s; }
.fx-burn i:nth-child(4) { left: 74%; --fd: .16s; height: 42%; }
@keyframes fxBurnFlame {
  0% { transform: translateY(18%) scaleY(.72) scaleX(.9); opacity: .75; }
  100% { transform: translateY(-16%) scaleY(1.12) scaleX(1.02); opacity: 1; }
}
@keyframes fxBurnFade {
  0% { opacity: 0; }
  15% { opacity: 1; }
  65% { opacity: .8; }
  100% { opacity: 0; }
}

/* ── Packs, rares, collection ────────────────────────────── */
.topbar-tools .btn { position: relative; }
.pack-badge {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 99px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--gold);
  color: #2a1c00;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  line-height: 1;
  box-shadow: 0 2px 8px rgba(255,200,87,.35);
}
.pack-badge.zero { background: rgba(255,255,255,.11); color: var(--faint); box-shadow: none; }

.card.is-rare {
  background:
    linear-gradient(160deg, #fdf9ee, #efe4cd) padding-box,
    linear-gradient(140deg, #ffe6a1, #ffb347 28%, #7fffe0 52%, #ffd166 74%, #f1a326) border-box;
  box-shadow: 0 9px 22px rgba(0,0,0,.45), 0 0 22px rgba(255,205,100,.24), inset 0 0 0 1px rgba(255,255,255,.5);
}
.card.is-rare::after {
  opacity: .78;
  background: linear-gradient(112deg, transparent 26%, rgba(255,240,180,.65) 44%, rgba(173,255,244,.32) 56%, transparent 72%);
}
.rare-badge {
  position: absolute;
  z-index: 4;
  top: 2.2cqw;
  left: 2.2cqw;
  display: inline-flex;
  align-items: center;
  gap: .8cqw;
  padding: .9cqw 1.8cqw;
  border-radius: 99px;
  background: linear-gradient(140deg, #ffe6a1, #ffc857);
  color: #3b2600;
  font-family: var(--font-body);
  font-size: max(3.7cqw, 5px);
  font-weight: 800;
  letter-spacing: .11em;
  line-height: 1;
  text-transform: uppercase;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
  white-space: nowrap;
}

/* ── Pack opening ────────────────────────────────────────── */
.pack-modal { width: min(640px, 100%); }
.pack-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
.pack-visual {
  position: relative;
  width: min(190px, 56vw);
  aspect-ratio: 3 / 4;
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    repeating-linear-gradient(115deg, transparent 0 13px, rgba(255,255,255,.03) 13px 15px),
    radial-gradient(120% 80% at 30% 0%, rgba(255,255,255,.2), transparent 50%),
    linear-gradient(155deg, #333b70, #1a1d3a 55%, #35213f);
  border: 1px solid rgba(255,255,255,.26);
  box-shadow: 0 26px 55px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.28);
}
.pack-visual::after {
  content: "";
  position: absolute;
  top: -40%;
  left: -45%;
  width: 55%;
  height: 180%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.24), transparent);
  transform: rotate(18deg);
  animation: packShine 3.8s ease-in-out infinite;
}
@keyframes packShine {
  0%, 42% { translate: 0 0; }
  72%, 100% { translate: 420% 0; }
}
.pack-emblem { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 9px; }
.pack-emblem svg { width: 62px; height: 62px; filter: drop-shadow(0 6px 16px rgba(69,224,196,.45)); }
.pack-emblem b {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 800;
  letter-spacing: .04em;
  text-shadow: 0 2px 8px rgba(0,0,0,.4);
}
.pack-emblem small {
  font-size: 8px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: rgba(255,255,255,.6);
}
.pack-tagline { color: var(--muted); font-size: 13px; max-width: 40ch; }
.pack-count-line { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); }
.pack-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 20px;
}
.pack-card {
  position: relative;
  min-width: 0;
  padding: 7px;
  border-radius: 10px;
  border: 3px solid transparent;
  background:
    linear-gradient(160deg, #fdf9ee, #efe4cd) padding-box,
    linear-gradient(155deg, var(--tl), var(--tc) 55%, var(--td)) border-box;
  box-shadow: 0 8px 18px rgba(0,0,0,.4), 0 0 16px rgba(255,255,255,.06);
  box-shadow: 0 8px 18px rgba(0,0,0,.4), 0 0 18px color-mix(in srgb, var(--tc, #ffffff) 22%, transparent);
  color: var(--card-ink);
  overflow: hidden;
  animation: packPop .5s cubic-bezier(.2,.8,.2,1) both;
  animation-delay: calc(var(--i, 0) * 85ms);
}
.pack-card.is-rare {
  background:
    linear-gradient(160deg, #fdf9ee, #efe4cd) padding-box,
    linear-gradient(140deg, #ffe6a1, #ffb347 28%, #7fffe0 52%, #ffd166 74%, #f1a326) border-box;
  box-shadow: 0 0 26px rgba(255,205,100,.4), 0 10px 22px rgba(0,0,0,.45);
}
@keyframes packPop {
  from { opacity: 0; transform: translateY(16px) scale(.9); }
  to { opacity: 1; transform: none; }
}
.pack-card .pack-art {
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 5 / 3.4;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid rgba(36,30,51,.15);
  background:
    radial-gradient(90% 70% at 50% 20%, rgba(255,255,255,.85), transparent 62%),
    linear-gradient(180deg, var(--tl), #fff9ee 90%);
}
.pack-card .pack-art svg { width: 100%; height: 100%; display: block; }
.pack-card .pack-gem svg { width: 52%; height: 52%; }
.pack-card .pack-name {
  display: block;
  margin-top: 6px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 12px;
  line-height: 1.1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pack-card .pack-kind {
  display: block;
  margin-top: 2px;
  font-size: 9px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: rgba(36,30,51,.58);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pack-new {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 3;
  padding: 2px 6px;
  border-radius: 99px;
  background: var(--accent);
  color: #2c0d05;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .08em;
  line-height: 1.2;
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.pack-card .rare-badge {
  top: 7px;
  left: 7px;
  padding: 2px 6px;
  font-size: 8px;
  letter-spacing: .08em;
}
.pack-note { margin-top: 12px; font-size: 11px; color: var(--faint); text-align: center; }

/* ── Deck builder ────────────────────────────────────────── */
.deck-modal {
  width: min(940px, 100%);
  display: flex;
  flex-direction: column;
  padding: clamp(16px, 2.6vw, 28px);
  overflow: hidden;
  max-height: calc(100dvh - 32px);
}
.deck-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex: none; }
.deck-head h2 { padding-right: 0; }
.deck-sub { margin-top: 5px; color: var(--muted); font-size: 12px; }
.deck-close { flex: none; }
.deck-summary { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 14px; flex: none; }
.summary-pill {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--muted);
  padding: 5px 9px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255,255,255,.035);
  white-space: nowrap;
}
.summary-pill b { color: var(--ink); font-weight: 500; }
.summary-pill.good { border-color: rgba(99,229,155,.3); color: var(--good); }
.summary-pill.bad { border-color: rgba(255,93,110,.32); color: var(--bad); }
.deck-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; flex: none; }
.deck-tab {
  font-family: var(--font-body);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 6px 11px;
  cursor: pointer;
}
.deck-tab:hover { color: var(--ink); border-color: var(--line-strong); }
.deck-tab.active { color: var(--accent-2); border-color: rgba(69,224,196,.4); background: rgba(69,224,196,.1); }
.deck-panes {
  display: grid;
  grid-template-columns: minmax(0, 1.18fr) minmax(0, .82fr);
  gap: 12px;
  margin-top: 11px;
  flex: 1;
  min-height: 0;
}
.deck-pane {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255,255,255,.025);
}
.deck-pane-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--line);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--muted);
  flex: none;
}
.deck-pane-head span:last-child { font-family: var(--font-mono); letter-spacing: 0; font-size: 10px; color: var(--faint); }
.deck-scroll {
  overflow-y: auto;
  padding: 7px;
  flex: 1;
  min-height: 0;
  max-height: min(47vh, 430px);
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.18) transparent;
}
.deck-scroll::-webkit-scrollbar { width: 6px; }
.deck-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 99px; }
.deck-row {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  padding: 5px 6px;
  border-radius: 9px;
}
.deck-row:hover { background: rgba(255,255,255,.04); }
.deck-thumb {
  width: 38px;
  aspect-ratio: 5 / 4;
  border-radius: 6px;
  overflow: hidden;
  border: 2px solid var(--tc, #666);
  box-shadow: 0 0 10px rgba(255,255,255,.05);
  background:
    radial-gradient(90% 70% at 50% 20%, rgba(255,255,255,.8), transparent 62%),
    linear-gradient(180deg, var(--tl), #fff9ee);
}
.deck-thumb svg { width: 100%; height: 100%; display: block; }
.deck-row.is-rare .deck-thumb { border-color: var(--gold); box-shadow: 0 0 10px rgba(255,200,87,.3); }
.deck-info { min-width: 0; }
.deck-info b {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.deck-info small { display: block; font-size: 9.5px; color: var(--muted); margin-top: 1px; line-height: 1.3; white-space: normal; overflow: visible; }
.rare-word { color: var(--gold); font-weight: 600; }
.deck-controls { display: flex; align-items: center; gap: 4px; }
.deck-count-chip {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--faint);
  min-width: 34px;
  text-align: right;
  white-space: nowrap;
}
.deck-count-chip b { color: var(--ink); font-weight: 500; }
.step-btn {
  width: 27px;
  height: 27px;
  padding: 0;
  display: grid;
  place-items: center;
  border-radius: 7px;
  border: 1px solid var(--line-strong);
  background: rgba(255,255,255,.06);
  color: var(--ink);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
}
.step-btn:hover:not(:disabled) { background: rgba(255,255,255,.12); }
.step-btn:disabled { opacity: .2; filter: grayscale(1); cursor: not-allowed; }
.step-btn.plus { color: var(--accent-2); border-color: rgba(69,224,196,.28); }
.step-btn.minus { color: #ff9a9f; }
.deck-type-group {
  padding: 9px 8px 3px;
  font-size: 8.5px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--faint);
}
.deck-type-group:first-child { padding-top: 4px; }
.deck-empty { padding: 22px 12px; text-align: center; color: var(--faint); font-size: 11.5px; line-height: 1.55; }
.deck-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 12px;
  flex: none;
}
.deck-msg { flex: 1 1 230px; font-size: 11.5px; color: var(--muted); min-width: 0; }
.deck-msg.error { color: var(--bad); }
.deck-msg.ok { color: var(--good); }
.deck-actions { display: flex; gap: 7px; flex-wrap: wrap; }
.deck-actions .btn { padding: 8px 12px; font-size: 12px; }

/* ── Reward banner + toast ───────────────────────────────── */
.reward-banner {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-top: 16px;
  padding: 11px 13px;
  border-radius: 13px;
  border: 1px solid rgba(255,200,87,.32);
  background: linear-gradient(135deg, rgba(255,200,87,.12), rgba(255,106,77,.055));
}
.reward-badge {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  flex: none;
  color: var(--gold);
  background: rgba(255,200,87,.13);
  border: 1px solid rgba(255,200,87,.22);
}
.reward-badge svg { width: 18px; height: 18px; }
.reward-text { min-width: 0; flex: 1 1 130px; }
.reward-text b { display: block; font-size: 12.5px; color: var(--ink); }
.reward-text span { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.reward-banner .btn { flex: none; }
.reward-hint { margin-top: 16px; font-size: 11.5px; color: var(--faint); }
.toast {
  position: fixed;
  z-index: 110;
  left: 50%;
  top: max(16px, env(safe-area-inset-top, 0px));
  transform: translate(-50%, -14px);
  max-width: calc(100vw - 32px);
  padding: 10px 16px;
  border-radius: 12px;
  border: 1px solid var(--line-strong);
  background: linear-gradient(160deg, #1d2237, #121522);
  color: var(--ink);
  font-size: 12.5px;
  text-align: center;
  box-shadow: 0 16px 40px rgba(0,0,0,.55);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ── Card preview, one at a time ─────────────────────────── */
.hand-preview-btn {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 9px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  cursor: pointer;
  white-space: nowrap;
}
.hand-preview-btn:hover { color: var(--ink); border-color: var(--line-strong); background: rgba(255,255,255,.05); }
.hand-preview-btn svg { width: 13px; height: 13px; }

.showcase-card {
  position: relative;
  width: min(300px, 72vw);
  aspect-ratio: 5 / 7;
  container-type: inline-size;
  flex: none;
}
.showcase-card > .card { width: 100%; height: 100%; }
.showcase-card .card--showcase { padding: 3.4cqw; gap: 1.7cqw; }
.showcase-new {
  position: absolute;
  top: -8px;
  right: -8px;
  z-index: 6;
  padding: 3px 9px;
  border-radius: 99px;
  background: var(--accent);
  color: #2c0d05;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  box-shadow: 0 3px 10px rgba(0,0,0,.4);
}
.viewer-overlay { z-index: 75; }
.viewer-panel {
  position: relative;
  z-index: 1;
  width: min(430px, 100%);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 22px 18px 18px;
  border-radius: 20px;
  border: 1px solid var(--line-strong);
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(69,224,196,.06), transparent 55%),
    linear-gradient(180deg, #161a2b, #0e111c);
  box-shadow: 0 30px 80px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.07);
}
.viewer-panel h2 { font-size: clamp(20px, 3vw, 25px); padding-right: 0; margin-bottom: 2px; }
.viewer-close {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 30px;
  height: 30px;
  padding: 0;
  font-size: 17px;
  line-height: 1;
}
.viewer-stage { margin: 12px 0 2px; display: flex; justify-content: center; }
.viewer-controls { display: flex; align-items: center; justify-content: center; gap: 13px; margin-top: 12px; }
.viewer-controls .btn { padding: 7px 14px; font-size: 16px; }
.viewer-count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); min-width: 42px; }
.viewer-note { margin-top: 10px; font-size: 10px; letter-spacing: .05em; color: var(--faint); }
.pack-stage { display: flex; justify-content: center; padding: 12px 0 0; }
.pack-stage .showcase-card { width: min(280px, 68vw); animation: packPop .45s cubic-bezier(.2,.8,.2,1) both; }

/* ── Match setup, pass & play, difficulty ────────────────── */
.mode-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.03);
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  line-height: 1.1;
}
.mode-chip:hover { color: var(--ink); border-color: var(--line-strong); background: rgba(255,255,255,.06); }
.mode-chip svg { width: 13px; height: 13px; flex: none; }
.mode-chip-diff { color: var(--faint); font-weight: 500; }
.ai-diff {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: .02em;
  text-transform: none;
  color: var(--faint);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 1px 5px;
  white-space: nowrap;
}
.match-modal { width: min(680px, 100%); }
.match-section { margin-top: 18px; }
.match-label {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: .17em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.match-mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.match-option {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.03);
  color: var(--ink);
  font-family: var(--font-body);
  text-align: left;
  cursor: pointer;
}
.match-option:hover { background: rgba(255,255,255,.065); border-color: var(--line-strong); }
.match-option.selected {
  border-color: rgba(69,224,196,.5);
  background: rgba(69,224,196,.09);
  box-shadow: 0 0 0 1px rgba(69,224,196,.16);
}
.match-option-icon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  flex: none;
  color: var(--accent-2);
  background: rgba(255,255,255,.06);
}
.match-option-icon svg { width: 19px; height: 19px; }
.match-option-text { min-width: 0; }
.match-option-text b { display: block; font-size: 13px; line-height: 1.2; }
.match-option-text small { display: block; margin-top: 3px; font-size: 11px; line-height: 1.35; color: var(--muted); }
.match-diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.difficulty-option {
  text-align: left;
  padding: 10px 12px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.03);
  color: var(--ink);
  font-family: var(--font-body);
  cursor: pointer;
}
.difficulty-option:hover { background: rgba(255,255,255,.06); border-color: var(--line-strong); }
.difficulty-option.selected { border-color: rgba(255,200,87,.55); background: rgba(255,200,87,.08); }
.difficulty-option b { display: block; font-size: 12.5px; }
.difficulty-option small { display: block; margin-top: 2px; font-size: 10.5px; line-height: 1.35; color: var(--muted); }
.match-note {
  margin-top: 16px;
  padding: 11px 13px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.03);
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}
.match-wait { margin-top: 14px; font-size: 11.5px; color: var(--gold); }
.pass-overlay {
  z-index: 120;
  background:
    radial-gradient(900px 600px at 50% -10%, rgba(69,224,196,.14), transparent 60%),
    radial-gradient(800px 600px at 50% 120%, rgba(255,106,77,.1), transparent 60%),
    var(--bg);
}
.pass-panel {
  width: min(460px, 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 12px;
  padding: 20px;
}
.pass-icon {
  width: 64px;
  height: 64px;
  border-radius: 20px;
  display: grid;
  place-items: center;
  color: var(--accent-2);
  background: rgba(69,224,196,.1);
  border: 1px solid rgba(69,224,196,.25);
  margin-bottom: 2px;
  box-shadow: 0 10px 30px rgba(69,224,196,.12);
}
.pass-icon svg { width: 32px; height: 32px; }
.pass-overlay h2 { font-size: clamp(26px, 5vw, 38px); padding: 0; }
.pass-sub { color: var(--muted); font-size: 13.5px; max-width: 36ch; line-height: 1.5; }
.pass-overlay .btn { margin-top: 8px; }
.pass-note { font-size: 10.5px; color: var(--faint); margin-top: 2px; }

/* ── Responsive ──────────────────────────────────────────── */
@media (max-width: 700px) {
  .app { padding-top: 0; }
  .topbar { padding-block: 12px 8px; gap: 10px; }
  .brand-mark { width: 34px; height: 34px; }
  .brand-mark svg { width: 34px; height: 34px; }
  .brand-sub { display: none; }
  .record { display: none; }
  .topbar-tools { gap: 6px; }
  .topbar-tools .btn-label { display: none; }
  .topbar-tools .btn { width: 36px; height: 36px; padding: 0; gap: 0; }
  .mode-chip { height: 36px; padding: 0 9px; }
  .mode-chip-diff { display: none; }
  .match-mode-grid { grid-template-columns: 1fr; }
  .match-diff-grid { grid-template-columns: 1fr; }
  .match-option { padding: 10px; }
  .topbar-tools .pack-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    font-size: 9px;
  }
  .table { border-radius: 20px; padding: 10px; }
  .side-head { font-size: 9.5px; gap: 7px; letter-spacing: .12em; }
  .side-name { font-size: 11px; }
  .statusbar { margin-top: 10px; padding: 9px 10px; }
  .status-text { font-size: 12.5px; flex-basis: 160px; }
  .status-actions .btn { padding: 8px 12px; font-size: 12px; }
  .hand-wrap { padding: 9px 8px 10px; border-radius: 15px; }
  .hand-rail { gap: 8px; padding-inline: 2px; }
  .rule-grid { grid-template-columns: 1fr; gap: 16px; }
  .modal { padding: 20px; border-radius: 18px; max-height: calc(100dvh - 24px); }
  .modal h2 { padding-right: 30px; }
  .modal-actions .btn { flex: 1 1 auto; }
  .weak-list { grid-template-columns: 1fr 1fr; }
  .pack-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pack-modal { padding: 18px; }
  .pack-hero { gap: 12px; }
  .pack-card .pack-name { font-size: 12.5px; }
  .reward-banner { flex-wrap: wrap; }
  .reward-banner .btn { flex: 1 1 100%; margin-left: 0; }
  .deck-modal { padding: 15px; overflow-y: auto; max-height: calc(100dvh - 20px); }
  .deck-panes { grid-template-columns: 1fr; gap: 9px; }
  .deck-scroll { max-height: 32vh; }
  .deck-summary { gap: 5px; }
  .summary-pill { padding: 4px 7px; font-size: 10px; }
  .deck-head h2 { font-size: 22px; }
  .deck-sub { font-size: 11px; }
  .deck-footer { margin-top: 10px; }
  .deck-msg { flex-basis: 100%; }
  .deck-actions { width: 100%; }
  .deck-actions .btn { flex: 1 1 auto; }
}
@media (max-width: 480px) {
  :root {
    --bench-w: clamp(54px, 14vw, 64px);
    --active-w: clamp(112px, 30vw, 126px);
    --hand-w: clamp(98px, 26vw, 112px);
  }
  .side-row { gap: 8px; }
  .bench-row { gap: 5px; }
  .table { padding: 9px; }
  .midline { margin-block: 6px; }
  .brand h1 { font-size: 19px; }
}
@media (max-width: 390px) {
  .slot-empty span { font-size: 8px; }
  .hand-hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<script>
'use strict';

/* ── Utilities ─────────────────────────────────────────────── */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
let seq = 0;
const uid = (p) => p + (++seq);
const delay = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-');
const pad2 = (n) => String(n).padStart(2, '0');
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
const reduced = () => motionQuery.matches;

/* ── Data ──────────────────────────────────────────────────── */

const SPECIES = {

const ENERGY_TYPES = Object.keys(TYPES);

  player: {

    energies: ['Fire', 'Fire', 'Fire', 'Fire', 'Grass', 'Grass', 'Grass', 'Grass', 'Electric', 'Electric', 'Electric', 'Electric']

/* ── State ─────────────────────────────────────────────────── */
let state = null;

  try { return localStorage.getItem('cc-muted') === '1'; } catch (e) { return false; }
}

    const raw = JSON.parse(localStorage.getItem('cc-record') || 'null');
