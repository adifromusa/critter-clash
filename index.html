          <path d="M2.5 19c.5-3 2.4-4.6 4.5-4.6s4 1.6 4.5 4.6M12.5 19c.5-3 2.4-4.6 4.5-4.6s4 1.6 4.5 4.6"/>
          <path d="M4 12h16M16.5 9l3 3-3 3"/>
        </svg>
      </span>
      <p class="eyebrow">Pass & play</p>
      <h2 id="pass-title">Pass to ${esc(to)}</h2>
      <p class="pass-sub">${esc(sub)}</p>
      <button class="btn btn--primary" data-action="pass-ready">${esc(button)}</button>
      <p class="pass-note">Hand the device to ${esc(to)} before tapping. ${esc(from)}'s hand is hidden.</p>
    </div>
  </div>`;
}

/* ── Retreat ───────────────────────────────────────────────── */
function retreat(sideId, target) {
  const side = state[sideId];
  const active = side.active;
  if (!active || !side.bench.includes(target)) return false;
  const cost = SPECIES[active.species].retreat;
  if (active.energy.length < cost || side.retreatedThisTurn) return false;
  const activeType = SPECIES[active.species].type;
  const ordered = [...active.energy].sort((a, b) => (a.type === activeType ? 1 : 0) - (b.type === activeType ? 1 : 0));
  const spent = ordered.slice(0, cost);
  active.energy = active.energy.filter((e) => !spent.includes(e));
  side.discard.push(...spent.map((e) => ({ kind: 'energy', type: e.type })));
  side.bench = side.bench.filter((c) => c.uid !== target.uid);
  side.active = target;
  side.bench.push(active);
  side.retreatedThisTurn = true;
  addLog(`${sideName(sideId)} ${verbFor(sideId, 'retreat', 'retreats')} ${SPECIES[active.species].name} and send${verbFor(sideId, '', 's')} out ${SPECIES[target.species].name}.`);
  sfx('retreat');
  render();
  return true;
}

function askRetreat(creature) {
  const sideId = controlSide();
  const p = state[sideId];
  if (state.phase !== 'battle' || state.turn !== sideId || state.busy) {
    notice('You can only retreat on your turn.');
    return;
  }
  if (state.promoteFor) return;
  if (!p.active) return;
  if (p.retreatedThisTurn) {
    notice('You already retreated this turn.');
    sfx('deny');
    return;
  }
  const cost = SPECIES[p.active.species].retreat;
  if (p.active.energy.length < cost) {
    notice(`${SPECIES[p.active.species].name} needs ${cost} energy to retreat. Attach some first.`);
    sfx('deny');
    return;
  }
  state.attachMode = null;
  state.evolveMode = null;
  state.pendingRetreat = creature.uid;
  sfx('click');
  render();
}

function confirmRetreat() {
  if (!state.pendingRetreat) return;
  const sideId = controlSide();
  const target = state[sideId].bench.find((c) => c.uid === state.pendingRetreat);
  state.pendingRetreat = null;
  if (!target) { render(); return; }
  const ok = retreat(sideId, target);
  if (!ok) notice('That retreat is not possible right now.');
}

/* ── AI ────────────────────────────────────────────────────── */
function chooseAiEnergyTarget() {
  const ai = state.ai;
  if (!ai.active) return ai.bench[0] || null;
  const activeSp = SPECIES[ai.active.species];
  const bigCost = activeSp.attacks[activeSp.attacks.length - 1].cost;
  if (ai.active.energy.length < bigCost) return ai.active;
  const bench = [...ai.bench].sort((a, b) => SPECIES[b.species].hp - SPECIES[a.species].hp);
  if (bench[0] && bench[0].energy.length < 2) return bench[0];
  return ai.active;
}

function shouldAiRetreat() {
  const ai = state.ai;
  const p = state.player;
  if (ai.retreatedThisTurn || !ai.active || !ai.bench.length) return false;
  const active = ai.active;
  const best = [...ai.bench].sort((a, b) => b.hp - a.hp)[0];
  const cost = SPECIES[active.species].retreat;
  if (active.energy.length < cost) return false;
  if (best.hp <= active.hp) return false;
  const threatened = p.active && WEAK_OF[SPECIES[active.species].type] === SPECIES[p.active.species].type;
  const hurt = active.hp <= 20 || (threatened && active.hp <= 30);
  return hurt && Math.random() < aiProfile().retreat;
}

function chooseAiAttack() {
  const ai = state.ai;
  const p = state.player;
  if (!ai.active || !p.active) return null;
  const sp = SPECIES[ai.active.species];
  const options = [];
  sp.attacks.forEach((atk, i) => {
    if (ai.active.energy.length < atk.cost) return;
    const info = attackInfo(sp, ai.active, p.active, atk);
    options.push({ idx: i, dmg: info.total });
  });
  if (!options.length) return null;
  options.sort((a, b) => b.dmg - a.dmg);
  if (options.length > 1 && Math.random() > aiProfile().attackIQ) {
    return options[Math.floor(Math.random() * options.length)].idx;
  }
  return options[0].idx;
}

function aiEvolveCandidates() {
  const ai = state.ai;
  const evos = ai.hand
    .filter((c) => c.kind === 'creature' && (SPECIES[c.species].stage || 0) > 0)
    .sort((a, b) => (SPECIES[b.species].stage - SPECIES[a.species].stage) || (SPECIES[b.species].hp - SPECIES[a.species].hp));
  for (const evo of evos) {
    const evoSp = SPECIES[evo.species];
    const candidates = [ai.active, ...ai.bench]
      .filter(Boolean)
      .filter((t) => t.species === evoSp.evolvesFrom && t.enteredTurn < state.turnNo)
      .sort((a, b) => (a === ai.active ? -1 : 0) - (b === ai.active ? -1 : 0) || b.hp - a.hp);
    if (candidates[0]) return { evo, target: candidates[0] };
  }
  return null;
}

async function aiEvolutionStep() {
  if (Math.random() > aiProfile().evolve) return;
  for (let pass = 0; pass < 2; pass++) {
    const pick = aiEvolveCandidates();
    if (!pick) return;
    evolveCreature('ai', pick.target, pick.evo);
    await delay(reduced() ? 80 : 720);
    if (state.phase !== 'battle') return;
  }
}

async function aiTurn() {
  if (state.phase !== 'battle' || state.turn !== 'ai') return;
  state.busy = true;
  const ai = state.ai;
  render();
  await delay(reduced() ? 80 : 420);
  if (state.phase !== 'battle') return;

  // Bench depth depends on Rhea's difficulty.
  const prof = aiProfile();
  let guard = 0;
  while (ai.bench.length < prof.bench && guard++ < 4) {
    const choice = ai.hand
      .filter((c) => c.kind === 'creature' && (SPECIES[c.species].stage || 0) === 0)
      .sort((a, b) => SPECIES[b.species].hp - SPECIES[a.species].hp)[0];
    if (!choice) break;
    ai.hand = ai.hand.filter((c) => c.uid !== choice.uid);
    choice.enteredTurn = state.turnNo;
    ai.bench.push(choice);
    addLog(`Rhea benches ${SPECIES[choice.species].name}.`);
    sfx('play');
    render();
    await delay(reduced() ? 60 : 420);
    if (state.phase !== 'battle') return;
  }

  // Retreat away from a bad spot.
  if (shouldAiRetreat()) {
    const best = [...ai.bench].sort((a, b) => b.hp - a.hp)[0];
    retreat('ai', best);
    await delay(reduced() ? 60 : 560);
    if (state.phase !== 'battle') return;
  }

  // Evolve any critter that has been in play since a previous turn.
  await aiEvolutionStep();
  if (state.phase !== 'battle') return;

  // Attach energy. Lower difficulties sometimes pick a random holder.
  if (!ai.attachedThisTurn) {
    const energies = ai.hand.filter((c) => c.kind === 'energy');
    if (energies.length) {
      let target = null;
      let card = null;
      if (Math.random() > prof.energyIQ) {
        const own = [ai.active, ...ai.bench].filter(Boolean);
        target = own[Math.floor(Math.random() * own.length)];
        card = energies[Math.floor(Math.random() * energies.length)];
      } else {
        target = chooseAiEnergyTarget();
        const matching = target && energies.find((e) => e.type === SPECIES[target.species].type);
        card = matching || energies[0];
      }
      if (target && card) {
        attachEnergy('ai', card, target);
        await delay(reduced() ? 60 : 600);
        if (state.phase !== 'battle') return;
      }
    }
  }

  await delay(reduced() ? 80 : 360);
  if (state.phase !== 'battle') return;
  const move = chooseAiAttack();
  if (move !== null) {
    await performAttack('ai', move);
  } else {
    addLog('Rhea has no attack ready. She ends her turn.');
    await endTurn();
  }
}

/* ── Input ─────────────────────────────────────────────────── */
function handleHandClick(uidValue) {
  const sideId = controlSide();
  const card = state[sideId].hand.find((c) => c.uid === uidValue);
  if (!card) return;
  if (state.phase === 'setup') {
    if (sideId !== state.setupSide) return;
    if (card.kind === 'creature') placeInSetup(card);
    else notice('Energy comes into play once the battle begins.');
    return;
  }
  if (state.phase === 'over' || state.promoteFor) return;
  if (state.turn !== sideId || state.busy) {
    notice('Wait for your turn.');
    return;
  }
  if (card.kind === 'energy') {
    toggleAttach(card);
  } else if (SPECIES[card.species].stage > 0) {
    toggleEvolution(card);
  } else {
    playCreature(card);
  }
}

function handleCreatureClick(uidValue, sideId) {
  const side = state[sideId];
  if (!side) return;
  const creature = [side.active, ...side.bench].find((c) => c && c.uid === uidValue);
  if (!creature) return;

  if (state.phase === 'setup') {
    if (sideId === state.setupSide) removeFromSetup(creature);
    return;
  }
  if (state.promoteFor === sideId && isHumanSide(sideId) && side.bench.includes(creature)) {
    choosePromote(creature);
    return;
  }
  if (sideId !== controlSide()) return;
  if (state.evolveMode && state.phase === 'battle') {
    evolveTarget(creature);
    return;
  }
  if (state.attachMode && state.phase === 'battle') {
    attachTo(creature);
    return;
  }
  if (state.busy || state.turn !== sideId) {
    notice('Wait for your turn.');
    return;
  }
  if (state.pendingRetreat === creature.uid) {
    confirmRetreat();
    return;
  }
  if (side.active && side.active.uid === creature.uid) return; // active card itself: no action
  askRetreat(creature);
}

function handleAction(action, el) {
  switch (action) {
    case 'start-battle':
      startBattle();
      break;
    case 'end-turn': {
      const sideId = controlSide();
      if (state.phase === 'battle' && state.turn === sideId && !state.busy) {
        state.attachMode = null;
        state.evolveMode = null;
        state.pendingRetreat = null;
        addLog(state.mode === 'solo' ? 'You end your turn.' : `${sideName(sideId)} ends their turn.`);
        endTurn();
      }
      break;
    }
    case 'cancel-evolve':
      state.evolveMode = null;
      render();
      break;
    case 'confirm-retreat':
      confirmRetreat();
      break;
    case 'cancel-retreat':
      state.pendingRetreat = null;
      render();
      break;
    case 'play-again':
      newGame({ mode: state.mode, difficulty: state.difficulty });
      break;
    case 'new-match':
      openMatchSetup();
      break;
    case 'play-friend':
      openMatchSetup('pvp');
      break;
    case 'close-match':
    case 'dismiss-match':
      closeMatchSetup();
      break;
    case 'match-mode':
      state.matchMode = el.dataset.mode === 'pvp' ? 'pvp' : 'solo';
      render();
      break;
    case 'match-difficulty':
      if (['easy', 'normal', 'hard', 'adaptive'].includes(el.dataset.difficulty)) {
        state.matchDifficulty = el.dataset.difficulty;
      }
      render();
      break;
    case 'start-match':
      startSelectedMatch();
      break;
    case 'pass-ready':
      acceptPass();
      break;
    case 'open-viewer':
      openHandViewer();
      break;
    case 'close-viewer':
      closeViewer();
      break;
    case 'viewer-prev':
      viewerStep(-1);
      break;
    case 'viewer-next':
      viewerStep(1);
      break;
    case 'packs':
      showPacks();
      break;
    case 'rip-pack':
      ripPack();
      break;
    case 'pack-next':
      if (state.packOpen && state.packOpen.cards) {
        state.packIndex = clamp((state.packIndex || 0) + 1, 0, state.packOpen.cards.length - 1);
        render();
      }
      break;
    case 'pack-prev':
      if (state.packOpen && state.packOpen.cards) {
        state.packIndex = clamp((state.packIndex || 0) - 1, 0, state.packOpen.cards.length - 1);
        render();
      }
      break;
    case 'pack-show-all':
      state.packShowAll = true;
      render();
      break;
    case 'pack-show-one':
      state.packShowAll = false;
      state.packIndex = 0;
      render();
      break;
    case 'close-pack':
      state.packOpen = null;
      render();
      break;
    case 'dismiss-pack':
      state.packOpen = null;
      render();
      break;
    case 'deck':
      openDeckBuilder();
      break;
    case 'close-deck':
      closeDeckBuilder();
      break;
    case 'clear-deck':
      clearDeckDraft();
      break;
    case 'auto-deck':
      autoFillDeck();
      break;
    case 'save-deck':
      saveDeck();
      break;
    case 'deck-filter':
      setDeckFilter(el.dataset.filter || 'all');
      break;
    case 'rules':
      state.rulesOpen = true;
      state.logOpen = false;
      state.matchOpen = false;
      render();
      break;
    case 'close-rules':
      state.rulesOpen = false;
      render();
      break;
    case 'log':
      state.logOpen = true;
      state.rulesOpen = false;
      state.matchOpen = false;
      render();
      break;
    case 'close-log':
      state.logOpen = false;
      render();
      break;
    case 'dismiss-overlay':
      if (el && el.classList.contains('overlay-backdrop')) {
        if (state.rulesOpen) state.rulesOpen = false;
        else if (state.logOpen) state.logOpen = false;
        render();
      }
      break;
    case 'sound':
      muted = !muted;
      saveMuted(muted);
      unlockAudio();
      if (!muted) sfx('click');
      renderTopbar();
      break;
    default:
      break;
  }
}

document.addEventListener('click', (e) => {
  unlockAudio();
  const target = e.target instanceof Element ? e.target : null;
  if (!target) return;

  const promoteEl = target.closest('[data-promote-uid]');
  if (promoteEl) {
    const promoteSideId = state.promoteFor;
    const c = promoteSideId
      ? state[promoteSideId].bench.find((x) => x.uid === promoteEl.dataset.promoteUid)
      : null;
    if (c) choosePromote(c);
    return;
  }

  const actionEl = target.closest('[data-action]');
  if (actionEl) {
    handleAction(actionEl.dataset.action, actionEl);
    return;
  }

  const deckAddEl = target.closest('[data-deck-add]');
  if (deckAddEl) {
    addToDeck(deckAddEl.dataset.deckAdd, deckAddEl.dataset.deckKey);
    return;
  }
  const deckRemoveEl = target.closest('[data-deck-remove]');
  if (deckRemoveEl) {
    removeFromDeck(deckRemoveEl.dataset.deckRemove, deckRemoveEl.dataset.deckKey);
    return;
  }

  const atkEl = target.closest('[data-attack]');
  if (atkEl) {
    const sideEl = atkEl.closest('[data-side]');
    const sideId = sideEl ? sideEl.dataset.side : null;
    if (sideId && sideId === controlSide()) {
      const idx = Number(atkEl.dataset.attack);
      if (state.phase === 'battle' && state.turn === sideId && !state.busy) {
        const active = state[sideId].active;
        if (!active) return;
        const atk = SPECIES[active.species].attacks[idx];
        if (active.energy.length < atk.cost) {
          notice(`Need ${atk.cost} energy on ${SPECIES[active.species].name}.`);
          sfx('deny');
          return;
        }
        performAttack(sideId, idx);
      }
    }
    return;
  }

  const handEl = target.closest('[data-hand-uid]');
  if (handEl) {
    handleHandClick(handEl.dataset.handUid);
    return;
  }

  const creatureEl = target.closest('[data-creature-uid]');
  if (creatureEl) {
    handleCreatureClick(creatureEl.dataset.creatureUid, creatureEl.dataset.side);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.deckOpen) {
      closeDeckBuilder();
      return;
    }
    if (state.packOpen) {
      state.packOpen = null;
      render();
      return;
    }
    if (state.matchOpen) {
      closeMatchSetup();
      return;
    }
    if (state.viewer) {
      state.viewer = null;
      render();
      return;
    }
    if (state.pass) return;
    if (state.rulesOpen || state.logOpen) {
      state.rulesOpen = false;
      state.logOpen = false;
      render();
    } else if (state.evolveMode) {
      state.evolveMode = null;
      render();
    } else if (state.attachMode) {
      state.attachMode = null;
      render();
    } else if (state.pendingRetreat) {
      state.pendingRetreat = null;
      render();
    }
    return;
  }
  if (state.viewer && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault();
    viewerStep(e.key === 'ArrowLeft' ? -1 : 1);
    return;
  }
  if (e.key === 'Enter' || e.key === ' ') {
    const el = document.activeElement;
    if (!el) return;
    if (el.dataset && el.dataset.handUid) {
      e.preventDefault();
      handleHandClick(el.dataset.handUid);
    } else if (el.dataset && el.dataset.creatureUid) {
      e.preventDefault();
      handleCreatureClick(el.dataset.creatureUid, el.dataset.side);
    }
  }
});

/* ── Boot ──────────────────────────────────────────────────── */
newGame();
</script>
