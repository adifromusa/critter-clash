/* ── Profile: collection, deck, packs ─────────────────────── */
const SAVE_KEY = 'cc-save-v1';
let memoryProfile = null;

function deepCopyDeck(deck) {
  return {
    creatures: { ...((deck && deck.creatures) || {}) },
    energies: { ...((deck && deck.energies) || {}) }
  };
}

function defaultDeck() {
  const creatures = {};
  STARTING_SPECIES.forEach((key) => { creatures[key] = 2; });
  return { creatures, energies: { Fire: 4, Grass: 4, Electric: 4 } };
}

function defaultProfile() {
  const deck = defaultDeck();
  return {
    creatures: { ...deck.creatures },
    energies: { ...deck.energies },
    deck,
    packs: 0,
    difficulty: 'normal',
    record: loadRecord()
  };
}

function cleanCounts(src, allowed) {
  const out = {};
  if (!src || typeof src !== 'object') return out;
  allowed.forEach((key) => {
    const n = Number(src[key]);
    if (Number.isFinite(n) && n > 0) out[key] = Math.min(99, Math.floor(n));
  });
  return out;
}

function deckTotals(deck) {
  const creatures = Object.values((deck && deck.creatures) || {}).reduce((a, b) => a + (Number(b) || 0), 0);
  const energy = Object.values((deck && deck.energies) || {}).reduce((a, b) => a + (Number(b) || 0), 0);
  return { creatures, energy, total: creatures + energy };
}

function validateDeck(deck, profile) {
  const problems = [];
  if (!deck || !deck.creatures || !deck.energies) {
    return { ok: false, problems: ['Deck data is missing.'], creatures: 0, baseCreatures: 0, energy: 0, total: 0 };
  }
  let creatures = 0;
  let baseCreatures = 0;
  let energy = 0;
  Object.entries(deck.creatures).forEach(([key, raw]) => {
    const n = Number(raw) || 0;
    if (!SPECIES[key]) { problems.push('The deck contains an unknown card.'); return; }
    if (n < 0) problems.push('The deck contains an invalid card count.');
    if (n > 2) problems.push(`${SPECIES[key].name}: maximum 2 copies.`);
    if (n > (profile.creatures[key] || 0)) problems.push(`${SPECIES[key].name}: you only own ${profile.creatures[key] || 0}.`);
    if ((SPECIES[key].stage || 0) === 0) baseCreatures += Math.max(0, n);
    creatures += Math.max(0, n);
  });
  Object.entries(deck.creatures).forEach(([key, raw]) => {
    const n = Number(raw) || 0;
    const sp = SPECIES[key];
    if (!sp || n <= 0 || !sp.stage) return;
    const preCount = Number(deck.creatures[sp.evolvesFrom]) || 0;
    if (preCount <= 0) problems.push(`${sp.name} needs ${SPECIES[sp.evolvesFrom].name} in the deck.`);
  });
  Object.entries(deck.energies).forEach(([type, raw]) => {
    const n = Number(raw) || 0;
    if (!TYPES[type]) { problems.push('The deck contains unknown energy.'); return; }
    if (n < 0) problems.push('The deck contains an invalid energy count.');
    if (n > (profile.energies[type] || 0)) problems.push(`${ENERGY_NAME[type]} Energy: you only own ${profile.energies[type] || 0}.`);
    energy += Math.max(0, n);
  });
  const total = creatures + energy;
  if (total !== 24) problems.push(`Deck needs exactly 24 cards (it has ${total}).`);
  if (creatures < 8) problems.push('Deck needs at least 8 creature cards.');
  if (baseCreatures < 4) problems.push('Deck needs at least 4 basic critters.');
  if (energy < 6) problems.push('Deck needs at least 6 energy cards.');
  return { ok: problems.length === 0, problems, creatures, baseCreatures, energy, total };
}

function fillDeck(draft, profile) {
  const total = () => deckTotals(draft).total;
  const creatureCount = () => deckTotals(draft).creatures;
  const baseCount = () => Object.keys(draft.creatures).reduce((sum, k) => {
    return sum + ((SPECIES[k] && (SPECIES[k].stage || 0) === 0) ? (draft.creatures[k] || 0) : 0);
  }, 0);
  const canAddCreature = (key) => (draft.creatures[key] || 0) < Math.min(2, profile.creatures[key] || 0);
  const addCreature = (key) => {
    if (total() >= 24 || !canAddCreature(key)) return false;
    draft.creatures[key] = (draft.creatures[key] || 0) + 1;
    return true;
  };
  const ownedBases = Object.keys(profile.creatures)
    .filter((k) => SPECIES[k] && (SPECIES[k].stage || 0) === 0 && profile.creatures[k] > 0)
    .sort((a, b) => SPECIES[b].hp - SPECIES[a].hp || TYPE_ORDER.indexOf(SPECIES[a].type) - TYPE_ORDER.indexOf(SPECIES[b].type));
  const ownedEvos = Object.keys(profile.creatures)
    .filter((k) => SPECIES[k] && (SPECIES[k].stage || 0) > 0 && profile.creatures[k] > 0)
    .sort((a, b) => (SPECIES[a].stage - SPECIES[b].stage) || ((SPECIES[b].rare ? 1 : 0) - (SPECIES[a].rare ? 1 : 0)) || (SPECIES[b].hp - SPECIES[a].hp));
  const ownedEnergy = ENERGY_TYPES.filter((t) => profile.energies[t] > 0);

  function addEnergy() {
    if (total() >= 24) return false;
    const available = ownedEnergy.filter((t) => (draft.energies[t] || 0) < (profile.energies[t] || 0));
    if (!available.length) return false;
    available.sort((a, b) => (draft.energies[b] || 0) - (draft.energies[a] || 0));
    draft.energies[available[0]] = (draft.energies[available[0]] || 0) + 1;
    return true;
  }

  // Make any existing evolutions legal by adding their earlier forms.
  let changed = true;
  let guard = 0;
  while (changed && guard++ < 40) {
    changed = false;
    Object.keys(draft.creatures).forEach((key) => {
      const sp = SPECIES[key];
      if (!sp || (draft.creatures[key] || 0) <= 0 || !sp.stage) return;
      if ((draft.creatures[sp.evolvesFrom] || 0) === 0 && addCreature(sp.evolvesFrom)) changed = true;
    });
  }

  // At least four basics so there is always a lead to set up.
  guard = 0;
  while (baseCount() < 4 && guard++ < 40) {
    const key = ownedBases.find((k) => canAddCreature(k));
    if (!key) break;
    addCreature(key);
  }

  // Fill creature slots with legal evolutions, then extra basics.
  guard = 0;
  while (creatureCount() < 12 && guard++ < 50) {
    const evoKey = ownedEvos.find((k) => canAddCreature(k) && (draft.creatures[SPECIES[k].evolvesFrom] || 0) > 0);
    if (evoKey) { if (!addCreature(evoKey)) break; continue; }
    const baseKey = ownedBases.find((k) => canAddCreature(k));
    if (baseKey) { if (!addCreature(baseKey)) break; continue; }
    break;
  }

  // Energy up to the minimum, then fill the remaining slots.
  guard = 0;
  while (deckTotals(draft).energy < 6 && guard++ < 40) {
    if (!addEnergy()) break;
  }
  guard = 0;
  while (total() < 24 && guard++ < 100) {
    if (addEnergy()) continue;
    const evoKey = ownedEvos.find((k) => canAddCreature(k) && (draft.creatures[SPECIES[k].evolvesFrom] || 0) > 0);
    if (evoKey && addCreature(evoKey)) continue;
    const baseKey = ownedBases.find((k) => canAddCreature(k));
    if (baseKey && addCreature(baseKey)) continue;
    break;
  }
  return draft;
}

function buildAutoDeck(profile) {
  return fillDeck({ creatures: {}, energies: {} }, profile);
}

function sanitizeProfile(raw) {
  const base = defaultProfile();
  if (!raw || typeof raw !== 'object') return base;
  const creatures = cleanCounts(raw.creatures, Object.keys(SPECIES));
  const energies = cleanCounts(raw.energies, ENERGY_TYPES);
  const packs = Math.max(0, Math.min(999, Math.floor(Number(raw.packs) || 0)));
  const rawRecord = raw.record;
  const record = rawRecord && Number.isFinite(Number(rawRecord.w)) && Number.isFinite(Number(rawRecord.l))
    ? { w: Math.max(0, Math.floor(Number(rawRecord.w))), l: Math.max(0, Math.floor(Number(rawRecord.l))) }
    : base.record;

  let ownedTotal = Object.values(creatures).reduce((a, b) => a + b, 0) + Object.values(energies).reduce((a, b) => a + b, 0);
  if (ownedTotal < 24) {
    STARTING_SPECIES.forEach((k) => { creatures[k] = Math.max(creatures[k] || 0, 2); });
    Object.entries(base.energies).forEach(([t, n]) => { energies[t] = Math.max(energies[t] || 0, n); });
  }

  const difficulty = ['easy', 'normal', 'hard', 'adaptive'].includes(raw.difficulty) ? raw.difficulty : 'normal';
  const profile = {
    creatures,
    energies,
    packs,
    difficulty,
    record,
    deck: {
      creatures: cleanCounts(raw.deck && raw.deck.creatures, Object.keys(SPECIES)),
      energies: cleanCounts(raw.deck && raw.deck.energies, ENERGY_TYPES)
    }
  };
  if (!validateDeck(profile.deck, profile).ok) {
    const fallback = defaultDeck();
    profile.deck = validateDeck(fallback, profile).ok ? fallback : buildAutoDeck(profile);
  }
  return profile;
}

function loadProfile() {
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (raw) return sanitizeProfile(raw);
  } catch (e) {}
  if (memoryProfile) return sanitizeProfile(memoryProfile);
  return defaultProfile();
}

function saveProfile(profile) {
  memoryProfile = profile;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(profile)); } catch (e) {}
}

function makeCreature(key) {
  const sp = SPECIES[key];
  return {
    uid: uid('c'),
    kind: 'creature',
    species: key,
    hp: sp.hp,
    maxHp: sp.hp,
    energy: [],
    enteredTurn: -1,
    underCards: []
  };
}
function makeEnergy(type) {
  return { uid: uid('e'), kind: 'energy', type };
}

function makeSide(id, deckSpec) {
  const deck = [];
  if (id === 'player' && deckSpec) {
    Object.entries(deckSpec.creatures || {}).forEach(([key, n]) => {
      for (let i = 0; i < n; i++) deck.push(makeCreature(key));
    });
    Object.entries(deckSpec.energies || {}).forEach(([type, n]) => {
      for (let i = 0; i < n; i++) deck.push(makeEnergy(type));
    });
  } else {
    const list = DECK_LISTS[id];
    list.creatures.forEach((k) => deck.push(makeCreature(k)));
    list.energies.forEach((t) => deck.push(makeEnergy(t)));
  }
  shuffle(deck);
  return {
    id,
    name: id === 'player' ? 'You' : 'Rhea',
    deck,
    hand: [],
    discard: [],
    active: null,
    bench: [],
    points: 0,
    attachedThisTurn: false,
    retreatedThisTurn: false
  };
}

function addLog(text, kind = '') {
  if (!state) return;
  state.log.push({ text, kind });
  if (state.log.length > 120) state.log.shift();
}
const otherOf = (id) => (id === 'player' ? 'ai' : 'player');

function sideName(id) {
  if (!state) return id === 'player' ? 'You' : 'Rhea';
  if (state.mode === 'pvp') return id === 'player' ? 'Player 1' : 'Player 2';
  return id === 'player' ? 'You' : 'Rhea';
}
function isHumanSide(id) {
  if (!state) return id === 'player';
  return state.mode === 'pvp' ? true : id === 'player';
}
function viewSideId() {
  return (state && state.viewSide) || 'player';
}
function controlSide() {
  if (!state) return 'player';
  if (state.phase === 'setup') return state.setupSide || 'player';
  if (state.mode === 'pvp') return state.turn || state.viewSide || 'player';
  return 'player';
}
function turnText(id) {
  if (!state) return 'Turn';
  if (state.mode === 'solo' && id === 'player') return 'Your turn';
  return `${sideName(id)}'s turn`;
}
function verbFor(id, pluralVerb, singularVerb) {
  return state && state.mode === 'solo' && id === 'player' ? pluralVerb : singularVerb;
}
function adaptiveLevel() {
  const wins = state && state.profile ? state.profile.record.w : 0;
  return Math.min(3, Math.floor(wins / 2));
}
function difficultyLabel() {
  if (!state) return 'Normal';
  if (state.difficulty === 'easy') return 'Easy';
  if (state.difficulty === 'hard') return 'Hard';
  if (state.difficulty === 'adaptive') return `Adaptive · Lv ${adaptiveLevel() + 1}`;
  return 'Normal';
}
function aiProfile() {
  const d = state ? state.difficulty : 'normal';
  if (d === 'easy') return { evolve: .35, attackIQ: .6, retreat: .15, bench: 2, energyIQ: .55 };
  if (d === 'hard') return { evolve: 1, attackIQ: 1, retreat: .8, bench: 3, energyIQ: 1 };
  if (d === 'adaptive') {
    const lv = adaptiveLevel();
    return {
      evolve: Math.min(1, .7 + lv * .1),
      attackIQ: Math.min(1, .8 + lv * .06),
      retreat: Math.min(.85, .5 + lv * .1),
      bench: 3,
      energyIQ: Math.min(1, .8 + lv * .06)
    };
  }
  return { evolve: .9, attackIQ: .9, retreat: .55, bench: 3, energyIQ: .9 };
}

function drawTop(side) {
  if (!side.deck.length) reshuffle(side);
  return side.deck.pop() || null;
}

function reshuffle(side) {
  if (!side.discard.length) return;
  const revived = [];
  side.discard.forEach((c) => {
    if (c.kind === 'creature') revived.push(makeCreature(c.species));
    else if (c.kind === 'energy') revived.push(makeEnergy(c.type));
  });
  side.deck.push(...revived);
  side.discard = [];
  shuffle(side.deck);
  const owner = (state.mode === 'solo' && side.id === 'player') ? 'Your' : `${sideName(side.id)}'s`;
  addLog(`${owner} discard is shuffled back into the deck.`);
}

function drawCards(side, n) {
  for (let i = 0; i < n; i++) {
    const card = drawTop(side);
    if (!card) break;
    side.hand.push(card);
  }
}

function dealOpeningHand(side) {
  for (let tries = 0; tries < 60; tries++) {
    side.hand = [];
    for (let i = 0; i < 6; i++) {
      const c = drawTop(side);
      if (c) side.hand.push(c);
    }
    if (side.hand.filter((c) => c.kind === 'creature' && (SPECIES[c.species].stage || 0) === 0).length >= 2) return;
    side.deck.push(...side.hand);
    side.hand = [];
    shuffle(side.deck);
  }
}

function newGame(opts = {}) {
  const profile = loadProfile();
  const mode = opts.mode === 'pvp' ? 'pvp' : 'solo';
  const requestedDifficulty = opts.difficulty;
  const difficulty = ['easy', 'normal', 'hard', 'adaptive'].includes(requestedDifficulty)
    ? requestedDifficulty
    : (['easy', 'normal', 'hard', 'adaptive'].includes(profile.difficulty) ? profile.difficulty : 'normal');
  profile.difficulty = difficulty;
  if (requestedDifficulty) saveProfile(profile);
  state = {
    phase: 'setup',
    turn: null,
    turnNo: 0,
    busy: false,
    winner: null,
    mode,
    difficulty,
    viewSide: 'player',
    setupSide: 'player',
    pass: null,
    attachMode: null,
    evolveMode: null,
    pendingRetreat: null,
    promoteFor: null,
    promoteResolve: null,
    notice: null,
    rulesOpen: false,
    logOpen: false,
    packOpen: null,
    packShowAll: false,
    packIndex: 0,
    deckOpen: false,
    deckDraft: null,
    deckFilter: 'all',
    deckMessage: null,
    viewer: null,
    matchOpen: false,
    matchMode: mode,
    matchDifficulty: difficulty,
    log: [],
    profile,
    record: profile.record,
    player: makeSide('player', profile.deck),
    ai: makeSide('ai')
  };
  dealOpeningHand(state.player);
  dealOpeningHand(state.ai);
  if (mode === 'solo') aiSetup();
  addLog(mode === 'pvp' ? 'Two players take the table.' : 'Rhea slaps down a challenge.', 'turn');
  addLog('Set up your squads, then start the clash.');
  render();
}

function aiSetup() {
  const side = state.ai;
  const creatures = side.hand
    .filter((c) => c.kind === 'creature' && (SPECIES[c.species].stage || 0) === 0)
    .sort((a, b) => {
      const sa = SPECIES[a.species], sb = SPECIES[b.species];
      return (sb.hp + sb.attacks[0].dmg * 4) - (sa.hp + sa.attacks[0].dmg * 4);
    });
  const picks = creatures.slice(0, Math.max(2, aiProfile().bench));
  picks.forEach((c, i) => {
    side.hand = side.hand.filter((x) => x.uid !== c.uid);
    c.enteredTurn = 0;
    if (i === 0) side.active = c;
    else side.bench.push(c);
  });
}

/* ── Rendering ─────────────────────────────────────────────── */
function typeVars(type) {
  const t = TYPES[type];
  return `--tc:${t.base};--td:${t.dark};--tl:${t.light};--ti:${t.ink}`;
}

function pips(count) {
  return Array.from({ length: count }, () => '<span class="pip pip--cost" title="energy"></span>').join('');
}

function energyGems(list) {
  if (!list.length) return '';
  const shown = list.slice(0, 5).map((e) => `<span class="pip" style="--pc:${TYPES[e.type].base};--pd:${TYPES[e.type].dark}"></span>`).join('');
  const extra = list.length > 5 ? `<span class="empty-energy">+${list.length - 5}</span>` : '';
  return shown + extra;
}

function sideHeadHTML(sideId) {
  const side = state[sideId];
  const p = side.points;
  const dots = [0, 1, 2].map((i) => `<i class="prize ${i < p ? 'won' : ''}"></i>`).join('');
  const isOpponent = sideId !== viewSideId();
  let handBits = '';
  if (isOpponent) {
    const back = side.hand.length ? '<i class="card-back"></i>' : '';
    handBits = `<span class="hand-stack" aria-hidden="true">${back}</span>
      <span class="hand-count">${side.hand.length} in hand</span>`;
  }
  const diffTag = state.mode === 'solo' && sideId === 'ai'
    ? `<span class="ai-diff">${esc(difficultyLabel())}</span>`
    : '';
  return `<span class="side-name">${esc(sideName(sideId))}</span>
    ${diffTag}
    <span class="prizes" role="img" aria-label="${p} of 3 knockouts">${dots}</span>
    ${handBits}
    <span class="side-sep" aria-hidden="true"></span>
    <span class="deck-count">deck ${side.deck.length}</span>`;
}

function turnPillHTML() {
  if (state.phase === 'setup') {
    const label = state.mode === 'pvp' ? `${sideName(state.setupSide)} setup` : 'Squad setup';
    return `<span class="turn-pill setup"><span class="dot"></span>${esc(label)}</span>`;
  }
  if (state.phase === 'over') return `<span class="turn-pill over"><span class="dot"></span>Match over</span>`;
  if (state.promoteFor && isHumanSide(state.promoteFor)) {
    return `<span class="turn-pill"><span class="dot"></span>${esc(sideName(state.promoteFor))}: choose a lead</span>`;
  }
  const mine = state.mode === 'solo' ? state.turn === 'player' : state.turn === viewSideId();
  return `<span class="turn-pill ${mine ? 'mine' : 'ai'}"><span class="dot"></span>${esc(turnText(state.turn))}
    <span class="turn-no">· ${pad2(state.turnNo)}</span></span>`;
}

function attackInfo(sp, attacker, defender, atk) {
  const weak = defender && WEAK_OF[SPECIES[defender.species].type] === sp.type ? 20 : 0;
  const sync = attacker.energy.some((e) => e.type === sp.type) ? 10 : 0;
  return { total: atk.dmg + weak + sync, weak, sync };
}

function evolveCardInHand() {
  if (!state.evolveMode) return null;
  return state[controlSide()].hand.find((c) => c.uid === state.evolveMode) || null;
}

function canEvolveTarget(evoCard, target) {
  if (!evoCard || !target) return false;
  const sp = SPECIES[evoCard.species];
  return !!(sp && sp.stage > 0 && sp.evolvesFrom && target.species === sp.evolvesFrom && target.enteredTurn < state.turnNo);
}

function activeSlotHTML(sideId, card) {
  if (!card) {
    let label = 'No active critter';
    if (state.phase === 'setup') label = sideId === state.setupSide ? 'Pick your lead' : 'No lead';
    else if (state.promoteFor) label = 'Choosing…';
    const plus = state.phase === 'setup' && sideId === state.setupSide ? '<span class="empty-plus" aria-hidden="true">+</span>' : '';
    return `<div class="slot slot--active"><div class="slot-empty slot-empty--active">${plus}<span>${label}</span></div></div>`;
  }
  const sp = SPECIES[card.species];
  const t = TYPES[sp.type];
  const foeSide = state[otherOf(sideId)];
  const foe = foeSide.active;
  const sync = card.energy.some((e) => e.type === sp.type);
  const pct = clamp((card.hp / card.maxHp) * 100, 0, 100);
  const hpClass = pct <= 25 ? 'crit' : pct <= 50 ? 'warn' : '';
  const controlled = sideId === controlSide();
  const attachable = controlled && state.attachMode && state.phase === 'battle';
  const evolvable = controlled && state.phase === 'battle' && canEvolveTarget(evolveCardInHand(), card);
  const interactive = controlled && state.phase === 'battle';
  const canAct = interactive && state.turn === sideId && !state.busy;
  const weakHot = foe && WEAK_OF[SPECIES[foe.species].type] === sp.type;
  const attacks = sp.attacks.map((a, i) => {
    const info = attackInfo(sp, card, foe, a);
    const boosted = info.weak > 0 || info.sync > 0;
    const affordable = card.energy.length >= a.cost;
    const costHTML = `<span class="cost">${pips(a.cost)}</span>`;
    const inner = `${costHTML}<span class="atk-name">${esc(a.name)}</span><span class="atk-dmg">${info.total}</span>`;
    const title = `${a.name}: ${a.dmg} damage${info.weak ? ` + ${info.weak} weakness` : ''}${info.sync ? ` + ${info.sync} sync` : ''}${!affordable ? ` · needs ${a.cost} energy` : ''}`;
    if (!interactive) {
      return `<div class="atk atk--static ${boosted ? 'is-boosted' : ''}" title="${esc(title)}">${inner}</div>`;
    }
    return `<button class="atk ${boosted ? 'is-boosted' : ''}" data-attack="${i}" ${(!canAct || !affordable) ? 'disabled' : ''} title="${esc(title)}" aria-label="${esc(a.name)}, ${info.total} damage${affordable ? '' : ', not enough energy'}">${inner}</button>`;
  }).join('');

  return `<div class="slot slot--active ${attachable ? 'attachable' : ''} ${evolvable ? 'evolvable' : ''}" data-slot-uid="${card.uid}">
    <div class="card card--active ${sp.rare ? 'is-rare' : ''}" data-creature-uid="${card.uid}" data-side="${sideId}"
         style="${typeVars(sp.type)}" role="group" tabindex="0"
         aria-label="${esc(sp.name)}, ${card.hp} of ${card.maxHp} hit points, ${sp.type} type${sp.rare ? ', rare' : ''}${sp.stage > 0 ? `, evolves from ${SPECIES[sp.evolvesFrom].name}` : ''}">
      <div class="card-head">
        <span class="type-pip" title="${sp.type}"></span>
        <span class="card-name">${esc(sp.name)}</span>
        <span class="card-hp">${card.hp}<small>/${card.maxHp}</small></span>
      </div>
      <div class="hp-track ${hpClass}"><span style="width:${pct}%"></span></div>
      <div class="art-frame">
        ${sp.rare ? '<span class="rare-badge">✦ rare</span>' : ''}
        ${creatureArt(sp)}
        <div class="energy-strip">
          ${card.energy.length ? energyGems(card.energy) : '<span class="empty-energy">no energy</span>'}
          ${sync ? '<span class="sync-chip">SYNC +10</span>' : ''}
        </div>
      </div>
      <div class="atk-list">${attacks}</div>
      <div class="card-foot">
        <span class="${weakHot ? 'hot' : ''}">Weak <b>${WEAK_OF[sp.type]}</b></span>
        <span>Retreat <b>${sp.retreat}</b></span>
      </div>
    </div>
    ${evolvable ? '<span class="evolve-tag">Evolve here</span>' : ''}
  </div>`;
}

function benchSlotHTML(sideId, card) {
  const sp = SPECIES[card.species];
  const t = TYPES[sp.type];
  const pct = clamp((card.hp / card.maxHp) * 100, 0, 100);
  const hpClass = pct <= 25 ? 'crit' : pct <= 50 ? 'warn' : '';
  const sync = card.energy.some((e) => e.type === sp.type);
  const controlled = sideId === controlSide();
  const attachable = controlled && state.attachMode && state.phase === 'battle';
  const promotable = state.promoteFor === sideId && isHumanSide(sideId);
  const evolvable = controlled && state.phase === 'battle' && canEvolveTarget(evolveCardInHand(), card);
  const clickable = controlled && !promotable && !attachable && state.phase === 'battle';
  return `<div class="slot slot--bench ${attachable || promotable ? 'attachable' : ''} ${promotable ? 'promotable' : ''} ${evolvable ? 'evolvable' : ''}" data-slot-uid="${card.uid}">
    <div class="card card--bench ${clickable ? '' : 'no-click'} ${sp.rare ? 'is-rare' : ''}" data-creature-uid="${card.uid}" data-side="${sideId}"
         style="${typeVars(sp.type)}" role="button" tabindex="0"
         aria-label="${esc(sp.name)}, bench, ${card.hp} of ${card.maxHp} hit points${sp.rare ? ', rare' : ''}${promotable ? ', choose as new lead' : ''}">
      <span class="bench-hp">${card.hp}</span>
      <div class="bench-art">
        ${sp.rare ? '<span class="rare-badge">✦ rare</span>' : ''}
        ${creatureArt(sp)}
        <div class="bench-energy">${card.energy.length ? energyGems(card.energy) : ''}${sync ? '<span class="sync-chip">+10</span>' : ''}</div>
      </div>
      <div class="bench-bar">
        <span class="bench-name">${esc(sp.name)}</span>
      </div>
      <div class="hp-track ${hpClass}" style="margin-top:1.2cqw"><span style="width:${pct}%"></span></div>
      ${promotable ? '<span class="promote-tag">Choose</span>' : ''}
    </div>
    ${evolvable ? '<span class="evolve-tag">Evolve here</span>' : ''}
  </div>`;
}

function benchRowHTML(sideId) {
  const side = state[sideId];
  const slots = side.bench.map((c) => benchSlotHTML(sideId, c));
  for (let i = side.bench.length; i < 3; i++) {
    slots.push(`<div class="slot-empty slot-empty--bench" aria-hidden="true"><span>bench</span></div>`);
  }
  return slots.join('');
}

function handCardHTML(card) {
  if (card.kind === 'energy') {
    const t = TYPES[card.type];
    const selected = state.attachMode === card.uid;
    return `<div class="hand-item ${selected ? 'is-selected' : ''}" data-hand-uid="${card.uid}" role="button" tabindex="0"
      style="${typeVars(card.type)}" aria-label="${ENERGY_NAME[card.type]} energy. Tap, then choose a critter to attach it to.">
      <div class="card energy-card">
        <div class="energy-inner">
          <span class="energy-kicker">Energy</span>
          <span class="energy-gem">${gemSVG(card.type)}</span>
          <span class="energy-name">${ENERGY_NAME[card.type]}</span>
          <span class="energy-type">${card.type} type</span>
          <span class="energy-zap">Tap, then pick<br>a critter</span>
        </div>
      </div>
    </div>`;
  }
  const sp = SPECIES[card.species];
  const mini = sp.attacks.map((a) => `<div class="mini-atk">
      <span class="cost">${pips(a.cost)}</span>
      <span class="mname">${esc(a.name)}</span>
      <span class="dmg">${a.dmg}</span>
    </div>`).join('');
  const evolvable = sp.stage > 0;
  const selected = state.evolveMode === card.uid;
  const aria = evolvable
    ? `${esc(sp.name)}, ${sp.hp} hit points${sp.rare ? ', rare' : ''}, evolves from ${SPECIES[sp.evolvesFrom].name}. Tap, then choose the critter to evolve.`
    : `${esc(sp.name)}, ${sp.hp} hit points${sp.rare ? ', rare' : ''}. Tap to place on your bench.`;
  return `<div class="hand-item ${selected ? 'is-selected' : ''}" data-hand-uid="${card.uid}" role="button" tabindex="0"
    style="${typeVars(sp.type)}" aria-label="${aria}">
    <div class="card card--hand ${sp.rare ? 'is-rare' : ''}">
      <div class="card-head">
        <span class="type-pip" title="${sp.type}"></span>
        <span class="card-name">${esc(sp.name)}</span>
        <span class="card-hp">${sp.hp}</span>
      </div>
      <div class="art-frame">
        ${sp.rare ? '<span class="rare-badge">✦ rare</span>' : ''}
        ${evolvable ? '<span class="evo-chip">Evo</span>' : ''}
        ${creatureArt(sp)}
      </div>
      <div class="mini-atks">${mini}</div>
      ${evolvable ? `<div class="evo-line">↑ Evolves from ${esc(SPECIES[sp.evolvesFrom].name)}</div>` : ''}
      <div class="card-foot">
        <span>Weak <b>${WEAK_OF[sp.type]}</b></span>
        <span>Ret <b>${sp.retreat}</b></span>
      </div>
    </div>
  </div>`;
}

function renderTopbar() {
  const rec = state.record;
  const total = rec.w + rec.l;
  $('#record-slot').innerHTML = state.mode === 'pvp'
    ? 'Friendly match'
    : (total ? `<b>${rec.w}</b>W · <b>${rec.l}</b>L` : 'First clash');
  const modeMain = $('#mode-chip-main');
  const modeDiff = $('#mode-chip-diff');
  if (modeMain) modeMain.textContent = state.mode === 'pvp' ? '2 players' : 'Solo';
  if (modeDiff) modeDiff.textContent = state.mode === 'pvp' ? '' : `· ${difficultyLabel()}`;
  const modeBtn = $('#mode-chip');
  if (modeBtn) modeBtn.setAttribute('aria-label', `Match setup. Current: ${state.mode === 'pvp' ? 'two players' : `solo, ${difficultyLabel()}`}`);
  const packs = state.profile ? state.profile.packs : 0;
  const badge = $('#pack-badge');
  if (badge) {
    badge.textContent = packs;
    badge.classList.toggle('zero', packs === 0);
  }
  const packBtn = $('[data-action="packs"]');
  if (packBtn) packBtn.setAttribute('aria-label', packs ? `Open card packs, ${packs} available` : 'Card packs, none available');
  const btn = $('#sound-btn');
  btn.innerHTML = muted
    ? `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6h2l3-2.5v9L4.5 10h-2z"/><path d="M11 6.5l4 3M15 6.5l-4 3"/></svg>`
    : `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6h2l3-2.5v9L4.5 10h-2z"/><path d="M10.5 5.5a3.4 3.4 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9"/></svg>`;
  btn.setAttribute('aria-pressed', String(!muted));
  btn.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
}

function renderBoard() {
  const bottom = viewSideId();
  const top = otherOf(bottom);
  $('#opp-head').innerHTML = sideHeadHTML(top);
  $('#player-head').innerHTML = sideHeadHTML(bottom);
  $('#opp-active').innerHTML = activeSlotHTML(top, state[top].active);
  $('#opp-bench').innerHTML = benchRowHTML(top);
  $('#player-active').innerHTML = activeSlotHTML(bottom, state[bottom].active);
  $('#player-bench').innerHTML = benchRowHTML(bottom);
  $('#midline').innerHTML = `<span class="line" aria-hidden="true"></span>${turnPillHTML()}<span class="line" aria-hidden="true"></span>`;
}

function renderHand() {
  const sideId = viewSideId();
  const side = state[sideId];
  const rail = $('#hand-rail');
  rail.innerHTML = side.hand.length
    ? side.hand.map(handCardHTML).join('')
    : `<p class="hand-empty">${state.mode === 'pvp' ? `${esc(sideName(sideId))}'s hand is empty.` : 'Your hand is empty.'} The deck will keep you going.</p>`;
  $('#hand-title').textContent = state.mode === 'pvp' ? `${sideName(sideId)}'s hand` : 'Your hand';
  const hint = $('#hand-hint');
  if (state.phase === 'setup') hint.textContent = 'Tap a basic critter to add it to your squad';
  else if (state.evolveMode) hint.textContent = 'Tap the matching critter in play';
  else if (state.attachMode) hint.textContent = 'Choose a critter to attach';
  else if (state.phase === 'over') hint.textContent = '';
  else if (side.attachedThisTurn) hint.textContent = 'Energy already attached this turn';
  else if (state.turn === sideId && !state.busy) hint.textContent = 'Tap energy to attach · tap a critter to bench it';
  else hint.textContent = '';
}

function contextualStatus() {
  if (state.notice) return state.notice;
  const sideId = controlSide();
  const side = state[sideId];
  if (state.phase === 'setup') {
    const prefix = state.mode === 'pvp' ? `${sideName(state.setupSide)}: ` : '';
    if (!side.active) return `${prefix}Tap a basic critter in your hand to lead your squad.`;
    if (side.bench.length < 2) return `${prefix}Tap up to two more basic critters for your bench, then get ready.`;
    return `${prefix}Squad ready. Evolutions wait for battle.`;
  }
  if (state.phase === 'over') {
    if (state.mode === 'pvp') return `${sideName(state.winner)} wins the friendly match.`;
    return state.winner === 'player' ? 'You win the clash. Rhea wants a rematch.' : 'Rhea takes this clash. Time for a rematch.';
  }
  if (state.promoteFor && isHumanSide(state.promoteFor)) {
    return `${sideName(state.promoteFor)}, choose the critter that steps up.`;
  }
  if (state.busy) {
    return state.mode === 'solo' && state.turn === 'ai' ? 'Rhea is plotting her move…' : 'Resolving…';
  }
  if (state.mode === 'solo' && state.turn === 'ai') return "Rhea's turn.";
  if (state.evolveMode) {
    const evo = side.hand.find((c) => c.uid === state.evolveMode);
    if (evo) {
      const sp = SPECIES[evo.species];
      return `Choose a ${SPECIES[sp.evolvesFrom].name} to evolve into ${sp.name}.`;
    }
  }
  if (state.attachMode) return 'Choose one of your critters to attach the energy.';
  if (state.pendingRetreat) {
    const active = side.active;
    const target = side.bench.find((c) => c.uid === state.pendingRetreat);
    if (active && target) {
      const cost = SPECIES[active.species].retreat;
      return `Retreat ${SPECIES[active.species].name} and send out ${SPECIES[target.species].name}? Costs ${cost} energy.`;
    }
  }
  if (!side.attachedThisTurn && side.hand.some((c) => c.kind === 'energy')) {
    return 'Attach energy, play a critter, then attack. Attacking ends your turn.';
  }
  return 'Pick an attack, or end your turn without attacking.';
}

function renderStatus() {
  const el = $('#status');
  el.textContent = contextualStatus();
  el.classList.toggle('flash', !!state.notice);
  const actions = $('#status-actions');
  const sideId = controlSide();
  const side = state[sideId];
  let html = '';
  if (state.phase === 'setup') {
    const ready = !!state[state.setupSide].active;
    const label = state.mode === 'pvp'
      ? (state.setupSide === 'player' ? 'Ready · pass' : 'Ready · start')
      : 'Start battle';
    if (state.mode === 'solo') {
      html += `<button class="btn btn--ghost" data-action="play-friend">Play with a friend</button>`;
    }
    html += `<button class="btn btn--primary" data-action="start-battle" ${ready ? '' : 'disabled'}>${label}</button>`;
  } else if (state.phase === 'over') {
    html += `<button class="btn btn--primary" data-action="play-again">Play again</button>`;
  } else if (state.evolveMode) {
    const canEnd = state.turn === sideId && !state.busy && !state.promoteFor;
    html += `<button class="btn btn--ghost" data-action="cancel-evolve">Cancel</button>`;
    html += `<button class="btn btn--primary" data-action="end-turn" ${canEnd ? '' : 'disabled'}>End turn</button>`;

    html += `<button class="btn btn--teal" data-action="confirm-retreat">Confirm retreat</button>
      <button class="btn btn--ghost" data-action="cancel-retreat">Cancel</button>`;
  } else {
    const canEnd = state.turn === sideId && !state.busy && !state.promoteFor;
    const attached = side.attachedThisTurn;
    html += `<span class="attach-chip ${attached ? 'used' : ''}">${attached ? 'Energy attached' : 'Energy ready'}</span>`;
    html += `<button class="btn btn--primary" data-action="end-turn" ${canEnd ? '' : 'disabled'}>End turn</button>`;
  }
  actions.innerHTML = html;
}

function logListHTML() {

/* ── Sound ─────────────────────────────────────────────────── */
let audioCtx = null;
function unlockAudio() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function tone({ freq = 440, to = null, dur = .15, type = 'sine', vol = .05, delay: d = 0 }) {
  if (!audioCtx || muted) return;
  try {
    const t0 = audioCtx.currentTime + d;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + .06);
  } catch (e) {}
}

let noiseBuffer = null;
function getNoiseBuffer() {
  if (!audioCtx) return null;
  if (!noiseBuffer) {
    const length = Math.floor(audioCtx.sampleRate * 0.5);
    noiseBuffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
  }
  return noiseBuffer;
}

function noiseBurst({ dur = .15, vol = .04, type = 'bandpass', freq = 1200, q = 1, to = null, delay: d = 0 } = {}) {
  if (!audioCtx || muted) return;
  try {
    const t0 = audioCtx.currentTime + d;
    const src = audioCtx.createBufferSource();
    src.buffer = getNoiseBuffer();
    const filter = audioCtx.createBiquadFilter();
    filter.type = type;
    filter.frequency.setValueAtTime(freq, t0);
    if (to) filter.frequency.exponentialRampToValueAtTime(Math.max(40, to), t0 + dur);
    filter.Q.value = q;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter).connect(gain).connect(audioCtx.destination);
    src.start(t0);
    src.stop(t0 + dur + .05);
  } catch (e) {}
}

function sfxTypeAttack(type) {
  if (!audioCtx || muted) return;
  if (type === 'Fire') {
    noiseBurst({ dur: .34, vol: .035, type: 'lowpass', freq: 1700, to: 420 });
    tone({ freq: 230, to: 70, dur: .3, vol: .04, type: 'sawtooth' });
    [0, .07, .15, .23].forEach((d) => noiseBurst({ dur: .05, vol: .018, type: 'highpass', freq: 2200, q: 1, delay: d }));
  } else if (type === 'Water') {
    // A bright slash that drops into a splash, with little droplet blips.
    noiseBurst({ dur: .24, vol: .045, type: 'bandpass', freq: 2400, to: 500, q: .9 });
    tone({ freq: 520, to: 210, dur: .2, vol: .025, type: 'sine', delay: .02 });
    [0, .05, .11, .18].forEach((d, i) => tone({ freq: 900 + i * 220, to: 1400 + i * 120, dur: .06, vol: .012, type: 'sine', delay: .08 + d }));
  } else if (type === 'Grass') {
    noiseBurst({ dur: .3, vol: .03, type: 'bandpass', freq: 2800, to: 900, q: 1.4 });
    tone({ freq: 660, to: 990, dur: .14, vol: .02, type: 'triangle', delay: .03 });
  } else if (type === 'Electric') {
    tone({ freq: 1000, to: 120, dur: .24, vol: .04, type: 'square' });
    noiseBurst({ dur: .2, vol: .024, type: 'highpass', freq: 2400, q: .8 });
    [0, .06, .12].forEach((d) => tone({ freq: 1800, to: 2600, dur: .04, vol: .018, type: 'sawtooth', delay: .04 + d }));
  } else if (type === 'Rock') {
    noiseBurst({ dur: .32, vol: .04, type: 'lowpass', freq: 700, to: 120 });
    tone({ freq: 120, to: 38, dur: .35, vol: .05, type: 'sine' });
    noiseBurst({ dur: .12, vol: .018, type: 'bandpass', freq: 900, q: 1.2, delay: .1 });
  } else if (type === 'Ice') {
    noiseBurst({ dur: .25, vol: .028, type: 'highpass', freq: 3000, q: .7 });
    [0, .06, .12, .2].forEach((d, i) => tone({ freq: 1800 + i * 420, dur: .09, vol: .015, type: 'sine', delay: d }));
    tone({ freq: 2600, to: 1800, dur: .3, vol: .018, type: 'triangle', delay: .05 });
  } else {
    SFX.attack();
  }
}
const SFX = {
  click: () => tone({ freq: 640, dur: .05, vol: .02, type: 'triangle' }),
  play: () => tone({ freq: 420, to: 580, dur: .13, vol: .035, type: 'triangle' }),
  attach: () => { tone({ freq: 520, to: 780, dur: .12, vol: .035 }); tone({ freq: 900, dur: .08, vol: .025, delay: .08 }); },
  evolve: () => {
    [392, 523, 659, 880].forEach((f, i) => tone({ freq: f, dur: .22, vol: .03, type: 'triangle', delay: i * .07 }));
    tone({ freq: 1046, to: 1318, dur: .3, vol: .022, delay: .3 });
  },
  attack: () => { tone({ freq: 320, to: 80, dur: .26, vol: .05, type: 'sawtooth' }); tone({ freq: 900, to: 280, dur: .16, vol: .022, type: 'square', delay: .02 }); },
  hit: () => tone({ freq: 140, to: 55, dur: .24, vol: .06 }),
  ko: () => [440, 330, 220, 140].forEach((f, i) => tone({ freq: f, to: f * .8, dur: .24, vol: .04, type: 'triangle', delay: i * .1 })),
  retreat: () => tone({ freq: 300, to: 620, dur: .16, vol: .03, type: 'triangle' }),
  deny: () => tone({ freq: 180, dur: .12, vol: .045, type: 'square' }),
  turn: () => { tone({ freq: 600, dur: .07, vol: .02 }); tone({ freq: 820, dur: .09, vol: .02, delay: .07 }); },
  pack: () => {
    [523, 659, 784, 1046].forEach((f, i) => tone({ freq: f, dur: .18, vol: .028, type: 'triangle', delay: i * .06 }));
    tone({ freq: 1318, to: 1568, dur: .3, vol: .018, delay: .28 });
  },
  win: () => [523, 659, 784, 1046].forEach((f, i) => tone({ freq: f, dur: .28, vol: .04, delay: i * .12 })),
  lose: () => [392, 330, 262, 196].forEach((f, i) => tone({ freq: f, dur: .28, vol: .038, delay: i * .13 }))
};
function sfx(name) { try { SFX[name](); } catch (e) {} }

function addFxBolt(x1, y1, x2, y2, type) {
  const t = TYPES[type];
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class', 'fx-bolt');
  svg.setAttribute('width', window.innerWidth);
  svg.setAttribute('height', window.innerHeight);
  svg.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
  const pts = [];
  for (let i = 0; i <= 8; i++) {
    const f = i / 8;
    const jitter = (i === 0 || i === 8) ? 0 : (Math.random() * 2 - 1) * Math.min(30, len * .14);
    pts.push([x1 + dx * f + (-dy / len) * jitter, y1 + dy * f + (dx / len) * jitter]);
  }
  const d = pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');
  svg.innerHTML = `<path d="${d}" fill="none" stroke="${t.base}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>

  setTimeout(() => svg.remove(), 750);
}

  const t = TYPES[type];
  const layer = $('#fx-layer');
  const vars = `--fx:${t.base};--fx-light:${t.light};--fx-dark:${t.dark}`;

  if (type === 'Electric') {
    addFxBolt(x1, y1, x2, y2, type);
  } else {
    const shot = document.createElement('span');
    shot.className = `fx-shot fx-${slug(type)}`;
    shot.style.cssText = `left:${x1}px;top:${y1}px;width:${len}px;transform:rotate(${ang}deg);${vars}`;
    shot.innerHTML = type === 'Fire'
      ? '<i class="core"></i><i class="flame f1"></i><i class="flame f2"></i>'
      : type === 'Water'
        ? '<i class="core"></i><i class="shot-drop sd1"></i><i class="shot-drop sd2"></i><i class="shot-drop sd3"></i>'
        : type === 'Rock'
          ? '<i class="core"></i><i class="rock-bit rb1"></i><i class="rock-bit rb2"></i>'
          : '<i class="core"></i>';
    layer.appendChild(shot);
    setTimeout(() => shot.remove(), 950);
  }

  const impact = document.createElement('div');
  impact.className = `fx-impact fx-${slug(type)}`;
  impact.style.cssText = `left:${x2}px;top:${y2}px;${vars}`;
  impact.innerHTML = `<i class="burst"></i>${(type === 'Water' || type === 'Ice') ? '<i class="ring"></i>' : ''}${fxParticles(type)}`;
  layer.appendChild(impact);
  setTimeout(() => impact.remove(), 1250);

  if (type === 'Water') {
    addFxSlash(x2, y2, type, -32);
    addFxSlash(x2 + 18, y2 - 10, type, 28);
  } else if (type === 'Grass' || type === 'Ice') {
    addFxSlash(x2, y2, type);
  }
}

function markUsedAttack(sideId, idx) {
  const cardEl = $(`${sideId === viewSideId() ? '#player-active' : '#opp-active'} [data-creature-uid]`);
  if (!cardEl) return;
  const btn = cardEl.querySelector(`[data-attack="${idx}"]`);
  if (btn) btn.classList.add('atk-used');
}

/* ── Game logic ────────────────────────────────────────────── */
function attachEnergy(sideId, card, target) {
  const side = state[sideId];
  side.hand = side.hand.filter((c) => c.uid !== card.uid);
  target.energy.push({ uid: card.uid, kind: 'energy', type: card.type });
  side.attachedThisTurn = true;
  addLog(`${sideName(sideId)} ${verbFor(sideId, 'attach', 'attaches')} ${ENERGY_NAME[card.type]} Energy to ${SPECIES[target.species].name}.`);
  sfx('attach');
  render();
}

function playCreature(card) {
  const sideId = controlSide();
  const p = state[sideId];
  const sp = SPECIES[card.species];
  if (sp.stage > 0) {
    toggleEvolution(card);
    return;
  }
  if (p.bench.length >= 3) {
    notice('The bench is full — three critters max.');
    sfx('deny');
    return;
  }
  state.evolveMode = null;
  p.hand = p.hand.filter((c) => c.uid !== card.uid);
  card.enteredTurn = state.turnNo;
  p.bench.push(card);
  addLog(`${sideName(sideId)} ${verbFor(sideId, 'bench', 'benches')} ${sp.name}.`);
  sfx('play');
  render();
}

function toggleEvolution(card) {
  const sideId = controlSide();
  const side = state[sideId];
  const sp = SPECIES[card.species];
  if (!sp || sp.stage === 0) return;
  if (state.phase === 'setup') {
    notice(`${sp.name} is an evolution. Set up a basic critter, then evolve it in battle.`);
    return;
  }
  if (state.phase !== 'battle') return;
  if (state.turn !== sideId || state.busy) {
    notice('Wait for your turn.');
    return;
  }
  if (state.evolveMode === card.uid) {
    state.evolveMode = null;
    render();
    return;
  }
  const preName = SPECIES[sp.evolvesFrom].name;
  const targets = [side.active, ...side.bench].filter(Boolean);
  const matches = targets.filter((t) => t.species === sp.evolvesFrom);
  if (!matches.length) {
    notice(`${sp.name} needs ${preName} in play. Play a basic critter first.`);
    sfx('deny');
    return;
  }
  if (!matches.some((t) => t.enteredTurn < state.turnNo)) {
    notice(`${preName} was played this turn. It can evolve on your next turn.`);
    sfx('deny');
    return;
  }
  state.notice = null;
  state.evolveMode = card.uid;
  state.attachMode = null;
  state.pendingRetreat = null;
  sfx('click');
  render();
}

function evolveTarget(target) {
  const sideId = controlSide();
  const p = state[sideId];
  const evoCard = p.hand.find((c) => c.uid === state.evolveMode);
  if (!evoCard) {
    state.evolveMode = null;
    render();
    return;
  }
  const sp = SPECIES[evoCard.species];
  if (!canEvolveTarget(evoCard, target)) {
    if (target && target.species === sp.evolvesFrom) {
      notice(`${SPECIES[target.species].name} needs a full turn in play before it can evolve.`);
    } else {
      notice(`${sp.name} evolves from ${SPECIES[sp.evolvesFrom].name}.`);
    }
    sfx('deny');
    return;
  }
  state.evolveMode = null;
  evolveCreature(sideId, target, evoCard);
}

function evolveCreature(sideId, target, evoCard) {
  const side = state[sideId];
  const oldSp = SPECIES[target.species];
  const newSp = SPECIES[evoCard.species];
  const damage = Math.max(0, target.maxHp - target.hp);
  target.underCards = target.underCards || [];
  target.underCards.push(target.species);
  target.species = evoCard.species;
  target.maxHp = newSp.hp;
  target.hp = Math.max(1, newSp.hp - damage);
  target.enteredTurn = state.turnNo;
  side.hand = side.hand.filter((c) => c.uid !== evoCard.uid);
  state.notice = null;
  addLog(`${sideName(sideId)} ${verbFor(sideId, 'evolve', 'evolves')} ${oldSp.name} into ${newSp.name}.`);
  sfx('evolve');
  render();
  const slot = $(`[data-slot-uid="${target.uid}"]`);
  if (slot) {
    slot.classList.add('is-evolving');
    setTimeout(() => slot.classList.remove('is-evolving'), 900);
  }
}

function toggleAttach(card) {
  const sideId = controlSide();
  const p = state[sideId];
  if (state.phase !== 'battle') {
    notice('Energy comes into play once the battle begins.');
    return;
  }
  if (state.turn !== sideId || state.busy) {
    notice('Wait for your turn.');
    return;
  }
  if (p.attachedThisTurn) {
    notice(`${sideName(sideId)} already attached energy this turn.`);
    sfx('deny');
    return;
  }
  state.notice = null;
  state.pendingRetreat = null;
  state.evolveMode = null;
  state.attachMode = state.attachMode === card.uid ? null : card.uid;
  sfx('click');
  render();
}

function attachTo(creature) {
  const sideId = controlSide();
  const p = state[sideId];
  const card = p.hand.find((c) => c.uid === state.attachMode);
  if (!card) {
    state.attachMode = null;
    render();
    return;
  }
  state.attachMode = null;
  attachEnergy(sideId, card, creature);
}

function placeInSetup(card) {
  if (state.phase !== 'setup') return;
  const p = state[state.setupSide];
  if (card.kind !== 'creature') return;
  const sp = SPECIES[card.species];
  if (sp.stage > 0) {
    notice(`${sp.name} is an evolution. Set up a basic critter, then play it on top later.`);
    return;
  }
  if (!p.active) {
    p.active = card;
  } else if (p.bench.length < 2) {
    p.bench.push(card);
  } else {
    notice('Setup allows one lead and two bench critters. Start the battle to add a third.');
    return;
  }
  card.enteredTurn = 0;
  p.hand = p.hand.filter((c) => c.uid !== card.uid);
  sfx('play');
  render();
}

function removeFromSetup(creature) {
  const p = state[state.setupSide];
  if (p.active && p.active.uid === creature.uid) p.active = null;
  else p.bench = p.bench.filter((c) => c.uid !== creature.uid);
  p.hand.push(creature);
  sfx('click');
  render();
}

function startBattle() {
  if (state.phase !== 'setup') return;
  const sideId = state.setupSide;
  if (!state[sideId].active) {
    notice('Place a lead critter first.');
    return;
  }
  if (state.mode === 'pvp') {
    state.pass = sideId === 'player'
      ? { to: 'ai', kind: 'setup' }
      : { to: 'player', kind: 'start' };
    state.busy = true;
    render();
    return;
  }
  state.phase = 'battle';
  state.busy = true;
  addLog('The clash begins. Three knockouts wins.', 'turn');
  render();
  setTimeout(() => startTurn('player'), 350);
}

function startTurn(sideId) {
  if (state.phase !== 'battle') return;
  state.turn = sideId;
  state.turnNo += 1;
  state.attachMode = null;
  state.evolveMode = null;
  state.pendingRetreat = null;
  state.busy = false;
  state.pass = null;
  state.viewSide = state.mode === 'pvp' ? sideId : 'player';
  const side = state[sideId];
  side.attachedThisTurn = false;
  side.retreatedThisTurn = false;
  drawCards(side, 1);
  addLog(`${turnText(sideId)} ${state.turnNo}.`, 'turn');
  render();
  if (state.mode === 'solo' && sideId === 'ai') {
    state.busy = true;
    render();
    setTimeout(aiTurn, reduced() ? 100 : 650);
  } else {
    sfx('turn');
  }
}

async function performAttack(sideId, attackIndex) {
  if (state.phase !== 'battle' || state.turn !== sideId) return;
  const side = state[sideId];
  const foe = state[otherOf(sideId)];
  const attacker = side.active;
  const defender = foe.active;
  if (!attacker || !defender) return;
  const sp = SPECIES[attacker.species];
  const atk = sp.attacks[attackIndex];
  if (!atk || attacker.energy.length < atk.cost) return;

  state.busy = true;
  state.attachMode = null;
  state.evolveMode = null;
  state.pendingRetreat = null;
  const defSp = SPECIES[defender.species];
  const weak = WEAK_OF[defSp.type] === sp.type ? 20 : 0;
  const sync = attacker.energy.some((e) => e.type === sp.type) ? 10 : 0;
  const total = atk.dmg + weak + sync;

  addLog(`${sideName(sideId)} ${verbFor(sideId, 'use', 'uses')} ${atk.name}.`);
  render();
  sfxTypeAttack(sp.type);
  fxAttack(attacker, defender, sp.type);
  await delay(reduced() ? 60 : 480);

  defender.hp = Math.max(0, defender.hp - total);
  render();
  markUsedAttack(sideId, attackIndex);
  sfx('hit');
  shakeBoard();
  floatDamage(defender, total);
  if (sp.type === 'Fire') addFxBurn(defender);
  if (sp.type === 'Water') addFxSplash(defender);
  addLog(`${atk.name} deals ${total} damage${weak ? ` (weakness +${weak})` : ''}${sync ? ` (sync +${sync})` : ''}.`);
  await delay(reduced() ? 110 : 760);

  if (state.phase !== 'battle') return;

  if (defender.hp <= 0) {
    await resolveKO(sideId, otherOf(sideId));
    if (state.phase === 'over') return;
  }
  await endTurn();
}

async function resolveKO(attackerSideId, defenderSideId) {
  const atkSide = state[attackerSideId];
  const defSide = state[defenderSideId];
  const fallen = defSide.active;
  if (!fallen) return;
  const fallenSp = SPECIES[fallen.species];

  addLog(`${fallenSp.name} is knocked out! ${sideName(attackerSideId)} ${verbFor(attackerSideId, 'take', 'takes')} a prize.`);
  sfx('ko');

  const slot = $(`[data-slot-uid="${fallen.uid}"]`);
  if (slot) slot.classList.add('is-ko');
  await delay(reduced() ? 100 : 640);

  defSide.discard.push({ kind: 'creature', species: fallen.species });
  (fallen.underCards || []).forEach((speciesKey) => {
    defSide.discard.push({ kind: 'creature', species: speciesKey });
  });
  fallen.energy.forEach((e) => defSide.discard.push({ kind: 'energy', type: e.type }));
  defSide.active = null;
  atkSide.points += 1;
  render();
  await delay(reduced() ? 80 : 380);

  if (atkSide.points >= 3) {
    finishMatch(attackerSideId);
    return;
  }
  if (defSide.bench.length === 0) {
    const have = (state.mode === 'solo' && defenderSideId === 'player') ? 'have' : 'has';
    addLog(`${sideName(defenderSideId)} ${have} no critters left to send out.`);
    finishMatch(attackerSideId);
    return;
  }
  await promote(defenderSideId);
}

function promote(sideId) {
  return new Promise((resolve) => {
    if (!isHumanSide(sideId)) {
      state.promoteFor = sideId;
      const aiSide = state[sideId];
      const best = [...aiSide.bench].sort((a, b) => (b.hp + b.energy.length * 8) - (a.hp + a.energy.length * 8))[0];
      render();
      setTimeout(() => {
        if (!best) { resolve(); return; }
        aiSide.bench = aiSide.bench.filter((c) => c.uid !== best.uid);
        aiSide.active = best;
        state.promoteFor = null;
        addLog(`${sideName(sideId)} sends out ${SPECIES[best.species].name}.`);
        sfx('play');
        render();
        resolve();
      }, reduced() ? 120 : 700);
    } else {
      state.promoteFor = sideId;
      state.promoteResolve = resolve;
      render();
    }
  });
}

function choosePromote(creature) {
  const sideId = state.promoteFor;
  if (!sideId || !isHumanSide(sideId)) return;
  const side = state[sideId];
  if (!side.bench.includes(creature)) return;
  side.bench = side.bench.filter((c) => c.uid !== creature.uid);
  side.active = creature;
  state.promoteFor = null;
  const resolve = state.promoteResolve;
  state.promoteResolve = null;
  addLog(`${sideName(sideId)} ${verbFor(sideId, 'send', 'sends')} out ${SPECIES[creature.species].name}.`);
  sfx('play');
  render();
  if (resolve) resolve();
}

async function endTurn() {
  if (state.phase !== 'battle') return;
  state.busy = true;
  state.attachMode = null;
  state.evolveMode = null;
  state.pendingRetreat = null;
  state.notice = null;
  render();
  await delay(reduced() ? 60 : 420);
  if (state.phase !== 'battle') return;
  const next = otherOf(state.turn);
  if (state.mode === 'pvp') {
    state.pass = { to: next, kind: 'turn' };
    state.busy = true;
    render();
    return;
  }
  state.turn = null;
  setTimeout(() => startTurn(next), reduced() ? 40 : 260);
}

function acceptPass() {
  if (!state.pass) return;
  const pass = state.pass;
  state.pass = null;
  state.busy = false;
  if (pass.kind === 'setup') {
    state.setupSide = pass.to;
    state.viewSide = pass.to;
    state.attachMode = null;
    state.evolveMode = null;
    state.pendingRetreat = null;
    render();
    return;
  }
  if (pass.kind === 'start') {
    state.phase = 'battle';
    addLog('Both squads are ready. The clash begins.', 'turn');
    startTurn(pass.to || 'player');
    return;
  }
  startTurn(pass.to);
}

function finishMatch(winnerId) {
  if (state.phase === 'over') return;
  state.phase = 'over';
  state.winner = winnerId;
  state.busy = true;
  state.promoteFor = null;
  state.attachMode = null;
  state.evolveMode = null;
  state.pendingRetreat = null;
  state.notice = null;
  const won = winnerId === 'player';
  const profile = state.profile;
  if (state.mode === 'solo') {
    addLog(won ? 'Victory! You win the clash.' : 'Rhea wins the clash.');
    profile.record = {
      w: profile.record.w + (won ? 1 : 0),
      l: profile.record.l + (won ? 0 : 1)
    };
    if (won) {
      profile.packs += 1;
      addLog('A critter pack is added to your reserve.');
    }
    state.record = profile.record;
    saveProfile(profile);
    sfx(won ? 'win' : 'lose');
  } else {
    addLog(`${sideName(winnerId)} wins the friendly match.`);
    sfx('win');
  }
  render();
}

/* ── Packs, collection & deck building ────────────────────── */
let toastTimer = null;
function toast(msg, ms = 2800) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

function pickOne(list) {
  return list[Math.floor(Math.random() * list.length)];
}

function packContents(profile) {
  const commons = [pickOne(COMMON_IDS), pickOne(COMMON_IDS), pickOne(COMMON_IDS)];
  const energies = [pickOne(ENERGY_TYPES), pickOne(ENERGY_TYPES)];
  const rest = [
    ...commons.map((species) => ({ kind: 'creature', species })),
    ...energies.map((type) => ({ kind: 'energy', type }))
  ];
  shuffle(rest);
  const sequence = [...rest, { kind: 'creature', species: pickOne(RARE_IDS) }];
  const cards = [];
  sequence.forEach((entry) => {
    if (entry.kind === 'creature') {
      const ownedBefore = profile.creatures[entry.species] || 0;
      profile.creatures[entry.species] = ownedBefore + 1;
      cards.push({ ...entry, rare: !!SPECIES[entry.species].rare, isNew: ownedBefore === 0 });
    } else {
      const ownedBefore = profile.energies[entry.type] || 0;
      profile.energies[entry.type] = ownedBefore + 1;
      cards.push({ ...entry, isNew: ownedBefore === 0 });
    }
  });
  return cards;
}

function metaOverlayBlocked() {
  if (state.phase !== 'battle') return false;
  if (state.busy) return true;
  if (state.mode === 'pvp') return !state.turn;
  return state.turn !== 'player';
}

function openMatchSetup(presetMode) {
  state.matchOpen = true;
  state.matchMode = presetMode === 'pvp' ? 'pvp' : state.mode;
  state.matchDifficulty = state.difficulty;
  state.packOpen = null;
  state.deckOpen = false;
  state.rulesOpen = false;
  state.logOpen = false;
  state.viewer = null;
  render();
}

function closeMatchSetup() {
  state.matchOpen = false;
  render();
}

function canStartNewMatch() {
  if (!state) return true;
  if (state.phase === 'over' || state.phase === 'setup') return true;
  if (state.busy) return false;
  if (state.mode === 'solo' && state.turn === 'ai') return false;
  return true;
}

function startSelectedMatch() {
  if (!canStartNewMatch()) {
    toast('Finish the current turn first.');
    return;
  }
  const mode = state.matchMode === 'pvp' ? 'pvp' : 'solo';
  const difficulty = ['easy', 'normal', 'hard', 'adaptive'].includes(state.matchDifficulty)
    ? state.matchDifficulty
    : 'normal';
  state.profile.difficulty = difficulty;
  saveProfile(state.profile);
  newGame({ mode, difficulty });
}

function showPacks() {
  if (metaOverlayBlocked()) {
    toast('Finish the current turn first.');
    return;
  }
  state.rulesOpen = false;
  state.logOpen = false;
  state.deckOpen = false;
  state.evolveMode = null;
  state.attachMode = null;
  state.packOpen = { phase: state.profile.packs > 0 ? 'sealed' : 'empty' };
  render();
}

function ripPack() {
  if (!state.profile.packs || state.profile.packs <= 0) {
    state.packOpen = { phase: 'empty' };
    render();
    return;
  }
  state.profile.packs -= 1;
  const cards = packContents(state.profile);
  saveProfile(state.profile);
  state.packOpen = { phase: 'revealed', cards };
  state.packShowAll = false;
  state.packIndex = 0;
  sfx('pack');
  render();
}

function openDeckBuilder() {
  if (metaOverlayBlocked()) {
    toast('Finish the current turn first.');
    return;
  }
  state.deckDraft = deepCopyDeck(state.profile.deck);
  state.deckFilter = 'all';
  state.deckMessage = null;
  state.deckOpen = true;
  state.packOpen = null;
  state.matchOpen = false;
  state.evolveMode = null;
  state.attachMode = null;
  state.rulesOpen = false;
  state.logOpen = false;
  render();
}

function closeDeckBuilder() {
  state.deckOpen = false;
  state.deckMessage = null;
  render();
}

function renderDeckKeepScroll() {
  const oldPanes = $$('#overlay-root .deck-scroll');
  const tops = oldPanes.map((el) => el.scrollTop);
  const oldModal = document.querySelector('#overlay-root .deck-modal');
  const modalTop = oldModal ? oldModal.scrollTop : 0;
  render();
  const newPanes = $$('#overlay-root .deck-scroll');
  newPanes.forEach((el, i) => { if (tops[i] != null) el.scrollTop = tops[i]; });
  const newModal = document.querySelector('#overlay-root .deck-modal');
  if (newModal) newModal.scrollTop = modalTop;
}

function setDeckFilter(filter) {
  state.deckFilter = filter;
  state.deckMessage = null;
  render();
}

function addToDeck(kind, key) {
  const draft = state.deckDraft;
  if (!draft) return;
  if (deckTotals(draft).total >= 24) {
    state.deckMessage = 'Deck is full. Remove a card before adding another.';
    renderDeckKeepScroll();
    return;
  }
  if (kind === 'creature') {
    if (!SPECIES[key]) return;
    const inDeck = draft.creatures[key] || 0;
    const owned = state.profile.creatures[key] || 0;
    if (inDeck >= 2) state.deckMessage = `Maximum 2 copies of ${SPECIES[key].name}.`;
    else if (inDeck >= owned) state.deckMessage = `You only own ${owned} ${SPECIES[key].name}.`;
    else { draft.creatures[key] = inDeck + 1; state.deckMessage = null; }
  } else {
    if (!TYPES[key]) return;
    const inDeck = draft.energies[key] || 0;
    const owned = state.profile.energies[key] || 0;
    if (inDeck >= owned) state.deckMessage = `You only own ${owned} ${ENERGY_NAME[key]} Energy.`;
    else { draft.energies[key] = inDeck + 1; state.deckMessage = null; }
  }
  renderDeckKeepScroll();
}

function removeFromDeck(kind, key) {
  const draft = state.deckDraft;
  if (!draft) return;
  if (kind === 'creature') {
    const n = draft.creatures[key] || 0;
    if (n <= 0) return;
    if (n === 1) delete draft.creatures[key];
    else draft.creatures[key] = n - 1;
  } else {
    const n = draft.energies[key] || 0;
    if (n <= 0) return;
    if (n === 1) delete draft.energies[key];
    else draft.energies[key] = n - 1;
  }
  state.deckMessage = null;
  renderDeckKeepScroll();
}

function autoFillDeck() {
  if (!state.deckDraft) return;
  fillDeck(state.deckDraft, state.profile);
  state.deckMessage = null;
  renderDeckKeepScroll();
}

function clearDeckDraft() {
  state.deckDraft = { creatures: {}, energies: {} };
  state.deckMessage = null;
  renderDeckKeepScroll();
}

function saveDeck() {
  const check = validateDeck(state.deckDraft, state.profile);
  if (!check.ok) {
    state.deckMessage = check.problems[0];
    renderDeckKeepScroll();
    return;
  }
  state.profile.deck = deepCopyDeck(state.deckDraft);
  saveProfile(state.profile);
  state.deckOpen = false;
  state.deckMessage = null;
  toast('Deck saved · it will be used in your next match');
  sfx('attach');
  render();
}

function collectionEntries() {
  const entries = [];
  Object.keys(SPECIES).forEach((key) => {
    const owned = state.profile.creatures[key] || 0;
    if (owned > 0) entries.push({ kind: 'creature', key, owned });
  });
  ENERGY_TYPES.forEach((type) => {
    const owned = state.profile.energies[type] || 0;
    if (owned > 0) entries.push({ kind: 'energy', key: type, owned });
  });
  return entries;
}

function filteredCollectionEntries(entries) {
  if (state.deckFilter === 'energy') return entries.filter((e) => e.kind === 'energy');
  if (state.deckFilter === 'rare') return entries.filter((e) => e.kind === 'creature' && SPECIES[e.key].rare);
  if (state.deckFilter === 'common') return entries.filter((e) => e.kind === 'creature' && !SPECIES[e.key].rare);
  return entries;
}

function deckRowHTML(entry) {
  const isCreature = entry.kind === 'creature';
  const sp = isCreature ? SPECIES[entry.key] : null;
  const type = isCreature ? sp.type : entry.key;
  const t = TYPES[type];
  const inDeck = isCreature ? (state.deckDraft.creatures[entry.key] || 0) : (state.deckDraft.energies[entry.key] || 0);
  const owned = entry.owned;
  const total = deckTotals(state.deckDraft).total;
  const canAdd = inDeck < owned && total < 24 && (!isCreature || inDeck < 2);
  const canRemove = inDeck > 0;
  const name = isCreature ? sp.name : `${ENERGY_NAME[entry.key]} Energy`;
  const meta = isCreature
    ? (sp.stage > 0
      ? `${sp.type} · ${sp.hp} HP · Evolves from ${SPECIES[sp.evolvesFrom].name}${sp.rare ? ' · <span class="rare-word">Rare</span>' : ''}`
      : `${sp.type} · ${sp.hp} HP · Basic${sp.rare ? ' · <span class="rare-word">Rare</span>' : ''}`)
    : `${entry.key} · Energy`;
  const thumb = isCreature ? creatureArt(sp) : gemSVG(entry.key);
  const rareClass = isCreature && sp.rare ? 'is-rare' : '';
  return `<div class="deck-row ${rareClass}">
    <span class="deck-thumb" style="${typeVars(type)}">${thumb}</span>
    <span class="deck-info"><b>${esc(name)}</b><small>${meta}</small></span>
    <span class="deck-controls">
      <span class="deck-count-chip"><b>${inDeck}</b> / ${owned}</span>
      <button class="step-btn minus" data-deck-remove="${entry.kind}" data-deck-key="${entry.key}" ${canRemove ? '' : 'disabled'} aria-label="Remove ${esc(name)} from the deck">−</button>
      <button class="step-btn plus" data-deck-add="${entry.kind}" data-deck-key="${entry.key}" ${canAdd ? '' : 'disabled'} aria-label="Add ${esc(name)} to the deck">+</button>
    </span>
  </div>`;
}

function collectionListHTML() {
  const entries = filteredCollectionEntries(collectionEntries());
  if (!entries.length) {
    if (state.deckFilter === 'rare') return '<div class="deck-empty">No rare critters yet. Win a battle to earn a pack.</div>';
    if (state.deckFilter === 'energy') return '<div class="deck-empty">No energy cards collected yet.</div>';
    return '<div class="deck-empty">No cards here yet. Win packs to grow your collection.</div>';
  }
  let html = '';
  TYPE_ORDER.forEach((type) => {
    const group = entries
      .filter((e) => e.kind === 'creature' && SPECIES[e.key].type === type)
      .sort((a, b) => (SPECIES[a.key].rare ? 1 : 0) - (SPECIES[b.key].rare ? 1 : 0) || SPECIES[b.key].hp - SPECIES[a.key].hp);
    if (!group.length) return;
    html += `<div class="deck-type-group">${type}</div>`;
    html += group.map(deckRowHTML).join('');
  });
  const energy = entries.filter((e) => e.kind === 'energy').sort((a, b) => TYPE_ORDER.indexOf(a.key) - TYPE_ORDER.indexOf(b.key));
  if (energy.length) {
    html += '<div class="deck-type-group">Energy</div>';
    html += energy.map(deckRowHTML).join('');
  }
  return html;
}

function deckListHTML() {
  const draft = state.deckDraft;
  const entries = [];
  Object.keys(draft.creatures || {}).forEach((key) => {
    if ((draft.creatures[key] || 0) > 0 && SPECIES[key]) {
      entries.push({ kind: 'creature', key, owned: state.profile.creatures[key] || 0 });
    }
  });
  ENERGY_TYPES.forEach((type) => {
    if ((draft.energies[type] || 0) > 0) {
      entries.push({ kind: 'energy', key: type, owned: state.profile.energies[type] || 0 });
    }
  });
  if (!entries.length) return '<div class="deck-empty">Your deck is empty. Add cards from your collection.</div>';
  let html = '';
  TYPE_ORDER.forEach((type) => {
    const group = entries
      .filter((e) => e.kind === 'creature' && SPECIES[e.key].type === type)
      .sort((a, b) => (SPECIES[a.key].rare ? 1 : 0) - (SPECIES[b.key].rare ? 1 : 0) || SPECIES[b.key].hp - SPECIES[a.key].hp);
    if (!group.length) return;
    html += `<div class="deck-type-group">${type}</div>`;
    html += group.map(deckRowHTML).join('');
  });
  const energy = entries.filter((e) => e.kind === 'energy').sort((a, b) => TYPE_ORDER.indexOf(a.key) - TYPE_ORDER.indexOf(b.key));
  if (energy.length) {
    html += '<div class="deck-type-group">Energy</div>';
    html += energy.map(deckRowHTML).join('');
  }
  return html;
}

function deckSummaryHTML() {
  const check = validateDeck(state.deckDraft, state.profile);
  return `<span class="summary-pill ${check.total === 24 ? 'good' : 'bad'}"><b>${check.total}</b>/24 cards</span>
    <span class="summary-pill ${check.creatures >= 8 ? 'good' : 'bad'}"><b>${check.creatures}</b> critters</span>
    <span class="summary-pill ${check.baseCreatures >= 4 ? 'good' : 'bad'}"><b>${check.baseCreatures}</b> basic</span>
    <span class="summary-pill ${check.energy >= 6 ? 'good' : 'bad'}"><b>${check.energy}</b> energy</span>`;
}

function deckMessageHTML() {
  if (state.deckMessage) return `<p class="deck-msg error">${esc(state.deckMessage)}</p>`;
  const check = validateDeck(state.deckDraft, state.profile);

  return `<p class="deck-msg">${esc(check.problems[0] || 'Finish the deck to save it.')}</p>`;
}

        </div>

function packCardHTML(card, index) {

      ${card.isNew ? '<span class="pack-new">New</span>' : ''}

function viewerCards() {
  if (!state.viewer) return [];
  return state[state.viewer.side].hand;
}

function openHandViewer() {
  const sideId = viewSideId();
  if (!state[sideId].hand.length) {
    toast('That hand is empty.');
    return;
  }
  state.viewer = { side: sideId, index: 0 };
  state.packOpen = null;
  state.rulesOpen = false;
  state.logOpen = false;
  state.matchOpen = false;
  state.deckOpen = false;
  render();
}

function closeViewer() {
  state.viewer = null;
  render();
}

function viewerStep(delta) {
  if (!state.viewer) return;
  const cards = viewerCards();
  if (!cards.length) { state.viewer = null; render(); return; }
  state.viewer.index = clamp(state.viewer.index + delta, 0, cards.length - 1);
  render();
}

  if (!state.viewer) return '';

  const index = clamp(state.viewer.index, 0, cards.length - 1);

  const title = state.mode === 'pvp' ? `${sideName(state.viewer.side)}'s hand` : 'Your hand';
  return `<div class="overlay viewer-overlay">
